name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Timeouts: a hung test fails the job instead of holding a runner for six hours. Each is several
  # times the job's usual length, with room for a cold build cache.
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Prettier format check
        run: npm run format:check

      - name: Frontend tests
        run: npm test

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Blocking: vulnerabilities, unsound and yanked crates fail the build. The few known,
      # non-actionable "unmaintained" advisories from Tauri's Linux stack are listed with
      # reasons in .cargo/audit.toml (read from the directory cargo audit runs in), the yanked
      # crates that cannot be updated yet in .cargo/audit-yanked.txt.
      - name: Security audit
        run: scripts/cargo-audit.sh

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Release builds ignore the sync dev variables
        working-directory: src-tauri
        env:
          MOONY_DEV_SYNC: "1"
          MOONY_RELAY_URL: "http://127.0.0.1:8787"
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release --lib services::sync::feature

      - name: Verify generated types
        working-directory: src-tauri
        run: |
          cargo test generate_bindings -- --ignored
          git diff --exit-code ../shared/generated-types.ts || (echo "Generated types are out of sync! Run 'cargo test generate_bindings -- --ignored' in src-tauri" && exit 1)

  # The phone-only code (`cfg(mobile)`, the moony-keychain Swift package) and the `libc` version in
  # Cargo.lock (0.2.190 broke the iOS build; 0.2.191 builds) are invisible to the Linux job above.
  rust-ios-check:
    name: Rust iOS Check
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Rust check (iOS simulator)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios-sim --lib

  # The Android app as a whole: the Rust library for arm64 (SQLCipher with its vendored OpenSSL),
  # the Kotlin plugins (moony-keychain, the vendored notification plugin), the manifest and the
  # Gradle project, assembled into a debug APK. The runner's preinstalled SDK and newest NDK are
  # used; scripts/android-env.sh points the cc crate at the NDK's llvm-ranlib.
  android-build:
    name: Android Debug Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The runner's own variables (not in the `env` context): JDK 21 for Gradle 9, the newest NDK.
      - name: Build the debug APK (arm64)
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run android:build -- --debug --apk --target aarch64 --ci

  # The Windows-only code (`cfg(target_os = "windows")`: the moony-keychain Windows Hello backend)
  # is invisible to the Linux job. Debug builds take the frontend from `devUrl`, so like the Linux
  # job this one needs no `dist`; SQLCipher needs OpenSSL, installed as in release.yml.
  rust-windows:
    name: Rust Windows Check
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install OpenSSL
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # clippy never links. Building the library links moony_lib.dll against the static OpenSSL,
      # which is where the v1.3.0 release build failed (system libraries, see src-tauri/build.rs).
      - name: Link the app library
        working-directory: src-tauri
        run: cargo build --lib --locked

      # The app's own test binary would die at load (no comctl32 v6 manifest for test binaries, which
      # rfd's TaskDialogIndirect needs; follow-up), so only the plugin's tests run here.
      - name: Rust tests (moony-keychain)
        working-directory: src-tauri
        run: cargo test -p moony-keychain --locked
