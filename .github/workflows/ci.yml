name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Prettier format check
        run: npm run format:check

      - name: Frontend tests
        run: npm test

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Blocking: vulnerabilities, unsound and yanked crates fail the build. The few known,
      # non-actionable "unmaintained" advisories from Tauri's Linux stack are listed with
      # reasons in .cargo/audit.toml (read from the directory cargo audit runs in), the yanked
      # crates that cannot be updated yet in .cargo/audit-yanked.txt.
      - name: Security audit
        run: scripts/cargo-audit.sh

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Verify generated types
        working-directory: src-tauri
        run: |
          cargo test generate_bindings -- --ignored
          git diff --exit-code ../shared/generated-types.ts || (echo "Generated types are out of sync! Run 'cargo test generate_bindings -- --ignored' in src-tauri" && exit 1)

  # The phone-only code (`cfg(mobile)`, the moony-keychain Swift package) and the `libc` version in
  # Cargo.lock (0.2.190 broke the iOS build; 0.2.191 builds) are invisible to the Linux job above.
  rust-ios-check:
    name: Rust iOS Check
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust check (iOS simulator)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios-sim --lib
