name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Prettier format check
        run: npm run format:check

      - name: Frontend tests
        run: npm test

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Blocking: vulnerabilities, unsound and yanked crates fail the build. The few known,
      # non-actionable "unmaintained" advisories from Tauri's Linux stack are listed with
      # reasons in .cargo/audit.toml (read from the directory cargo audit runs in), the yanked
      # crates that cannot be updated yet in .cargo/audit-yanked.txt.
      - name: Security audit
        run: scripts/cargo-audit.sh

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Verify generated types
        working-directory: src-tauri
        run: |
          cargo test generate_bindings -- --ignored
          git diff --exit-code ../shared/generated-types.ts || (echo "Generated types are out of sync! Run 'cargo test generate_bindings -- --ignored' in src-tauri" && exit 1)

  # The phone-only code (`cfg(mobile)`, the moony-keychain Swift package) and the `libc` version in
  # Cargo.lock (0.2.190 broke the iOS build; 0.2.191 builds) are invisible to the Linux job above.
  rust-ios-check:
    name: Rust iOS Check
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Rust check (iOS simulator)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios-sim --lib

  # The Windows-only code (`cfg(target_os = "windows")`: the moony-keychain Windows Hello backend)
  # is invisible to the Linux job. Debug builds take the frontend from `devUrl`, so like the Linux
  # job this one needs no `dist`; SQLCipher needs OpenSSL, installed as in release.yml.
  rust-windows:
    name: Rust Windows Check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install OpenSSL
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace
