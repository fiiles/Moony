name: Release

# Runs for tags of the form vX.Y.Z. A tag with a hyphen (v1.0.0-rc.1) is published as a
# pre-release. The release is created as a draft that the owner reviews and publishes by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Tag must equal the version in all three manifests
        # A pre-release suffix (v1.0.0-rc.1, v0.9.0-test.1) is ignored for the comparison:
        # the manifests carry the plain version, the hyphen only marks the GitHub pre-release.
        run: |
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected%%-*}"
          status=0
          check() {
            echo "$1: $2"
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 has version '$2', but the tag $GITHUB_REF_NAME requires '$expected'. Bump the version before tagging (docs/playbooks/release.md)."
              status=1
            fi
          }
          check package.json "$(jq -r .version package.json)"
          check src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          check src-tauri/Cargo.toml "$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "([^"]*)".*/\1/')"
          exit "$status"

  build:
    name: Build (${{ matrix.platform }})
    needs: check-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-15
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}${{ matrix.args }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Version for the release notes
        # v1.0.0-rc.1 -> 1.0.0: the file names carry the plain version from the manifests
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=${v%%-*}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Moony v__VERSION__'
          releaseBody: |
            Moony is a private personal finance app: your records stay on your computer, in an encrypted database. What changed in this version is in the [changelog](https://github.com/fiiles/Moony/blob/main/CHANGELOG.md).

            ## Download

            | Your computer | File |
            |---|---|
            | Mac with Apple Silicon (M1, M2, M3, M4 …) | `Moony_${{ env.VERSION }}_aarch64.dmg` |
            | Mac with an Intel processor | `Moony_${{ env.VERSION }}_x64.dmg` |
            | Windows 10 or 11, 64-bit | `Moony_${{ env.VERSION }}_x64-setup.exe` |
            | Linux, any distribution | `Moony_${{ env.VERSION }}_amd64.AppImage` |
            | Debian, Ubuntu | `Moony_${{ env.VERSION }}_amd64.deb` |
            | Fedora, openSUSE | `Moony-${{ env.VERSION }}-1.x86_64.rpm` |

            Not sure which Mac you have? Apple menu → **About This Mac**: the *Chip* line says *Apple M…* or *Intel*.

            The `.tar.gz`, `.sig` and `latest.json` files are for the built-in updater; you do not need to download them.

            ## First launch: the installers are not signed yet

            Moony is not yet signed by Apple or Microsoft, so your system warns you the first time you open it. The app is not damaged. You need the step below once, for the copy you downloaded in your browser.

            ### macOS

            1. Open the `.dmg` and drag **Moony** into **Applications**.
            2. Open **Terminal** (Applications → Utilities → Terminal), paste this line and press Return:
               ```
               xattr -cr /Applications/Moony.app
               ```
               It removes the "downloaded from the internet" mark that makes macOS say *"Moony is damaged and can't be opened"*.
            3. Open Moony as usual.

            If macOS instead says that it *cannot verify the developer*, you can also skip Terminal: try to open Moony once, then go to **System Settings → Privacy & Security**, scroll to *Security* and click **Open Anyway** next to Moony.

            ### Windows

            1. If the browser says the file is not commonly downloaded, keep it. In Edge: **⋯ → Keep → Show more → Keep anyway**.
            2. Run the installer. When SmartScreen shows *"Windows protected your PC"*, click **More info**, then **Run anyway**.

            ### Linux

            - **AppImage:** `chmod +x Moony_${{ env.VERSION }}_amd64.AppImage`, then run it. Some distributions need the `libfuse2` package first.
            - **Debian / Ubuntu:** `sudo apt install ./Moony_${{ env.VERSION }}_amd64.deb`
            - **Fedora / openSUSE:** `sudo dnf install ./Moony-${{ env.VERSION }}-1.x86_64.rpm`

            ## After installing

            Moony asks for a password and shows a **recovery key** on the first start; save the key somewhere safe. Later versions arrive through the built-in updater after you unlock the app (you can switch the check off in Settings → Security). More in the [README](https://github.com/fiiles/Moony#install).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
