name: Release

# Runs for tags of the form vX.Y.Z. A tag with a hyphen (v1.0.0-rc.1) is published as a
# pre-release. The release is created as a draft that the owner reviews and publishes by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Tag must equal the version in all three manifests
        # A pre-release suffix (v1.0.0-rc.1, v0.9.0-test.1) is ignored for the comparison:
        # the manifests carry the plain version, the hyphen only marks the GitHub pre-release.
        run: |
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected%%-*}"
          status=0
          check() {
            echo "$1: $2"
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 has version '$2', but the tag $GITHUB_REF_NAME requires '$expected'. Bump the version before tagging (docs/playbooks/release.md)."
              status=1
            fi
          }
          check package.json "$(jq -r .version package.json)"
          check src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          check src-tauri/Cargo.toml "$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "([^"]*)".*/\1/')"
          exit "$status"

  create-release:
    name: Create draft release
    needs: check-version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create the draft once, before any build leg
        id: create
        # Body: .github/release-body.md with @VERSION@ replaced. The "Upgrading from 0.10.0"
        # paragraph there is for 0.11.x and 0.12.0; remove it after the first 0.12 release.
        # A re-run reuses the draft that already carries this tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          v="${v%%-*}"
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)"
          if [ -z "$id" ]; then
            sed "s/@VERSION@/$v/g" .github/release-body.md > "$RUNNER_TEMP/body.md"
            prerelease=false
            case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Moony v$v" \
              -F draft=true \
              -F prerelease="$prerelease" \
              -F body=@"$RUNNER_TEMP/body.md" \
              --jq .id)"
          fi
          echo "Release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-15
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}${{ matrix.args }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Release notes
        id: body
        # v1.0.0-rc.1 -> 1.0.0: the file names carry the plain version from the manifests
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo 'text<<RELEASE_BODY_EOF'
            sed "s/@VERSION@/${v%%-*}/g" .github/release-body.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Uploads into the one draft that create-release made. Without releaseId every leg
          # created its own draft (v0.11.0 ended up split across two releases).
          releaseId: ${{ needs.create-release.outputs.release-id }}
          # Notes for the updater's latest.json: the same text as the release page.
          releaseBody: ${{ steps.body.outputs.text }}
          args: ${{ matrix.args }}
