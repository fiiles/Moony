name: Release

# Runs for tags of the form vX.Y.Z. A tag with a hyphen (v1.0.0-rc.1) is published as a
# pre-release. The release is created as a draft that the owner reviews and publishes by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Tag must equal the version in all three manifests
        # A pre-release suffix (v1.0.0-rc.1, v0.9.0-test.1) is ignored for the comparison:
        # the manifests carry the plain version, the hyphen only marks the GitHub pre-release.
        run: |
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected%%-*}"
          status=0
          check() {
            echo "$1: $2"
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 has version '$2', but the tag $GITHUB_REF_NAME requires '$expected'. Bump the version before tagging (docs/playbooks/release.md)."
              status=1
            fi
          }
          check package.json "$(jq -r .version package.json)"
          check src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          check src-tauri/Cargo.toml "$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "([^"]*)".*/\1/')"
          exit "$status"

  create-release:
    name: Create draft release
    needs: check-version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create the draft once, before any build leg
        id: create
        # Body: .github/release-body.md with @VERSION@ replaced and @CHANGES@ replaced by this
        # version's CHANGELOG.md section (the update dialog links here for "What's new"); a
        # version without a section fails. A re-run reuses the draft that already carries this tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          v="${v%%-*}"
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)"
          if [ -z "$id" ]; then
            # The lines between "## [<version>]" and the next "## [" heading, outer blank lines trimmed.
            awk -v head="## [$v]" '
              index($0, head) == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { lines[++n] = $0 }
              END {
                first = 1; while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
                last = n; while (last >= first && lines[last] ~ /^[[:space:]]*$/) last--
                for (i = first; i <= last; i++) print lines[i]
              }
            ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
            if [ ! -s "$RUNNER_TEMP/changes.md" ]; then
              echo "::error::CHANGELOG.md has no section '## [$v]'. Move the Unreleased entries under it before tagging (docs/playbooks/release.md)."
              exit 1
            fi
            awk -v v="$v" -v changes="$RUNNER_TEMP/changes.md" '
              $0 == "@CHANGES@" { while ((getline line < changes) > 0) print line; next }
              { gsub(/@VERSION@/, v); print }
            ' .github/release-body.md > "$RUNNER_TEMP/body.md"
            prerelease=false
            case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Moony v$v" \
              -F draft=true \
              -F prerelease="$prerelease" \
              -F body=@"$RUNNER_TEMP/body.md" \
              --jq .id)"
          fi
          echo "Release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-15
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    env:
      # macOS signing and notarization switch on only once the Developer ID secrets exist; without
      # them the Macs build unsigned as before. Tauri starts signing as soon as APPLE_CERTIFICATE is
      # set, even to an empty string, so the variables are exported by a step instead.
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}${{ matrix.args }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Updater notes
        id: body
        # One plain line for latest.json, not the release page: the update dialog of 0.12.2 and
        # older prints the notes verbatim, newer builds ignore them and link to the release page.
        # v1.0.0-rc.1 -> 1.0.0: the manifests carry the plain version.
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "text=What's new in Moony ${v%%-*}: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Apple signing and notarization
        # Developer ID Application certificate (base64 .p12) and an App Store Connect API key for
        # notarytool; Tauri imports the certificate into a temporary keychain of its own.
        if: contains(matrix.platform, 'macos') && env.APPLE_SIGNING == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
          printf '%s\n' "$API_KEY_P8" > "$key_path"
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Uploads into the one draft that create-release made. Without releaseId every leg
          # created its own draft (v0.11.0 ended up split across two releases).
          releaseId: ${{ needs.create-release.outputs.release-id }}
          # Notes for the updater's latest.json (with releaseId, tauri-action leaves the release
          # page body alone).
          releaseBody: ${{ steps.body.outputs.text }}
          args: ${{ matrix.args }}

      - name: Verify the macOS signature and notarization
        # Fails the leg (and so the release check) if the app came out unsigned or without a
        # stapled notarization ticket; the assets are already in the draft, which stays unpublished.
        if: contains(matrix.platform, 'macos') && env.APPLE_SIGNING == 'true'
        shell: bash
        run: |
          app="$(ls -d src-tauri/target/*/release/bundle/macos/Moony.app | head -n1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
