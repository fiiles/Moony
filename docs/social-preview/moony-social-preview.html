      :root {
        /* Palette from docs/design-system/tokens.css. */
        --canvas: #eeece7;
        --paper: #fbfaf7;
        --ink: #292822;
        --muted: #817e75;
        --line: #e2dfd7;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 640px; }
      body { font-family: Inter, sans-serif; color: var(--ink); }
      .preview {
        position: relative;
        isolation: isolate;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: radial-gradient(ellipse at 70% 15%, var(--paper) 0%, var(--paper) 26%, var(--canvas) 100%);
      }
      .copy { position: absolute; top: 76px; left: 80px; z-index: 2; }
      .eyebrow {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 30px -7px;
        font-size: 136px;
        font-weight: 700;
        letter-spacing: -.085em;
        line-height: 1;
      }

        margin: 0;
