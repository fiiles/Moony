<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moony — detail bankovního účtu (návrh)</title>
<link rel="stylesheet" href="../design-system/moony.css">
<style>
  /* Prototype-only styles. Everything else comes from the design system. */
  html { overflow-y: scroll; }
  .sidebar { top: 42px; height: calc(100vh - 42px); }

  /* Prototype bar (above the app) */
  .proto-bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 18px; height: 42px; padding: 0 20px; background: var(--dark-grad); box-shadow: var(--sh-dark); color: var(--ink-inverse-2); font-size: 11px; font-weight: 600; }
  .proto-bar__tag { padding: 3px 7px; border-radius: 5px; background: rgba(255,255,255,.14); color: #fff; font-size: 9px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  .proto-bar__title { color: #fff; font-weight: 650; letter-spacing: -.01em; }
  .proto-bar__mode { font-weight: 500; }
  .proto-bar__mode b { color: #fff; font-weight: 650; }
  .proto-bar__spacer { flex: 1; }
  @media (max-width: 1320px) { .proto-bar__mode { display: none; } }
  .proto-bar .seg { background: rgba(255,255,255,.11); }
  .proto-bar .seg__btn { color: var(--ink-inverse-2); transition: none; }
  .proto-bar .seg__btn:hover { color: #fff; }
  .proto-bar .seg__btn.is-active { background: var(--paper); color: var(--ink); box-shadow: none; }
  .proto-bar__toggle { display: inline-flex; align-items: center; gap: 10px; color: #fff; cursor: pointer; }
  .proto-bar .switch input { background: rgba(255,255,255,.22); }
  .proto-bar .switch input:checked { background: #f4f2ec; }
  .proto-bar .switch input:checked::after { background: var(--dark); }

  /* Design-note callouts */
  .has-np { position: relative; }
  .np { position: absolute; z-index: 4; display: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--dark-grad); box-shadow: var(--sh-dark), 0 0 0 2px var(--canvas); color: #fff; font-size: 10px; font-weight: 700; font-style: normal; line-height: 20px; text-align: center; pointer-events: none; }
  .notes-on .np { display: block; }
  .np--tl { left: -10px; top: -10px; }
  .np--tc { left: 50%; top: -17px; margin-left: -10px; }
  .np--inline { position: static; margin-left: auto; }
  .notes-on .np--inline { display: inline-block; }
  .notes-card { display: none; }
  .notes-on .notes-card { display: block; }
  .notes { display: grid; grid-template-columns: 1fr 1fr; column-gap: 44px; margin: 0; padding: 0 21px 10px; list-style: none; }
  .notes li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 13px 0; border-top: 1px solid var(--line-soft); color: var(--ink-2); font-size: var(--fs-table); line-height: 1.55; }
  .notes li:nth-child(-n+2) { border-top: 0; }
  .notes .np { position: static; display: inline-block; margin-top: 1px; box-shadow: var(--sh-dark); }
  .notes b { display: block; color: var(--ink); font-weight: 650; }
  .notes .badge { margin-top: 6px; }
  .card--flat .card__head { padding-bottom: 16px; }

  /* Page layout */
  .stack { display: flex; flex-direction: column; gap: 17px; }
  .stack .stats { margin-bottom: 0; }

  /* Month arrows (flows card) */
  .pnav { position: relative; display: inline-flex; align-items: center; gap: 4px; }
  .flip { transform: scaleX(-1); }

  /* Hero (balance) and flows card */
  .hero__delta--quiet span { margin-left: 0; }
  .hero--compact::after { display: none; }
  .hero--compact { padding-top: 20px; }
  .hero--compact .hero__value { margin: 6px 0; font-size: 22px; letter-spacing: -0.05em; }
  .axis--slots span { flex: 1; text-align: center; }
  .chart svg path { pointer-events: none; }
  .chart .bar { cursor: pointer; transition: opacity var(--t-base); }
  .chart .bar.is-muted { opacity: .35; }
  .chart .slot { fill: transparent; cursor: pointer; }
  .chart .slot:hover { fill: rgba(41,40,34,.035); }

  /* Menus */
  .menu-host { position: relative; text-align: right; }
  .menu-host .menu { right: 0; top: calc(100% + 4px); text-align: left; }
  .actions .menu-host .menu { top: calc(100% + 6px); }

  /* Transakce card */
  .led-grid { grid-template-columns: 62px minmax(0,1fr) 190px 150px; column-gap: 16px; }
  .ledger-head { flex-wrap: wrap; }
  .ledger-head .toolbar { flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .ledger-sub { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 0 21px 15px; }
  .ledger-period { position: relative; display: flex; align-items: center; gap: 8px; }
  .ledger-period .input { width: 150px; height: 35px; padding: 0 9px; font-size: var(--fs-table); }
  .select-wrap--period { width: 190px; }
  .select-wrap--sm { width: 176px; }
  .select-wrap--sm .select { height: 35px; font-size: var(--fs-table); }
  .entity > div { min-width: 0; }
  .entity b, .entity small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty--wide p { max-width: 400px; }
  .empty .actions { justify-content: center; }
  .pager { display: inline-flex; gap: 4px; }

  /* Modals */
  .modal__scroll { max-height: 420px; overflow-y: auto; }
  .modal .table { border-top: 0; }
  .modal .table__head, .modal .table__row { padding: 0 27px; column-gap: 12px; }
  .modal .table__head { position: sticky; top: 0; z-index: 1; }
  .hist-m { grid-template-columns: 116px minmax(0,1fr) minmax(0,1fr) 92px 32px; }
  .imp-m { grid-template-columns: 76px minmax(0,1fr) 120px 82px 66px 184px; }
  .modal .empty { padding: 40px 24px; }
  .rate-cap { margin: 14px 0 16px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; line-height: 1.5; }
  .row-2--date { grid-template-columns: 1fr 172px; }
  .input-wrap--unit .input { padding-left: 11px; padding-right: 38px; }
  .rec-note { display: flex; align-items: center; gap: 6px; margin: -4px 0 18px; color: var(--ink-3); font-size: var(--fs-caption); font-weight: 500; }
  .rec-note[hidden] { display: none; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="proto-bar__tag">Návrh</span>
  <span class="proto-bar__title">Detail bankovního účtu</span>
  <div class="seg" data-seg="scn" id="scn">
    <button type="button" class="seg__btn" data-value="a">A · Spořicí účet</button>
    <button type="button" class="seg__btn" data-value="b">B · Běžný účet</button>
    <button type="button" class="seg__btn" data-value="c">C · Hlavní účet</button>
    <button type="button" class="seg__btn" data-value="d">D · Spořicí s pohyby</button>
    <button type="button" class="seg__btn" data-value="e">E · Nový účet</button>
    <button type="button" class="seg__btn" data-value="f">F · Starý účet</button>
  </div>
  <span class="proto-bar__mode">Sekce: <b id="sections-name">zůstatek</b></span>
  <span class="proto-bar__spacer"></span>
  <label class="proto-bar__toggle"><span>Poznámky k návrhu</span><span class="switch"><input type="checkbox" id="notes-toggle"></span></label>
</div>

<div class="app">
  <aside class="sidebar"></aside>
  <main class="page" id="page"></main>
</div>

<div class="modal-scrim" id="m-rec">
  <form class="modal" onsubmit="return false" aria-labelledby="rec-title">
    <div class="modal__head">
      <div><h2 id="rec-title">Zaznamenat zůstatek</h2><p>Zůstatek se uloží do historie účtu k vybranému dni.</p></div>
      <button type="button" class="modal__close" aria-label="Zavřít" id="rec-x"></button>
    </div>
    <div class="modal__body">
      <div class="row-2 row-2--date">
        <div class="field">
          <label class="field__label" for="rec-amt">Částka</label>
          <div class="input-wrap input-wrap--unit"><input class="input" id="rec-amt" inputmode="decimal" autocomplete="off" placeholder="např. 450 000"><span class="unit">Kč</span></div>
          <div class="field__hint">Zůstatek z výpisu nebo z bankovnictví. Importované transakce ho nemění.</div>
        </div>
        <div class="field">
          <label class="field__label" for="rec-date">K datu</label>
          <input class="input" type="date" id="rec-date" value="2026-10-10">
        </div>
      </div>
      <div class="rec-note" id="rec-note" hidden></div>
    </div>
    <div class="modal__foot">
      <button type="button" class="btn btn--ghost" id="rec-cancel">Zrušit</button>
      <div class="actions"><button type="button" class="btn btn--primary" id="rec-ok">Zaznamenat zůstatek</button></div>
    </div>
  </form>
</div>
<div class="modal-scrim" id="m-hist"><div class="modal" role="dialog" aria-labelledby="hist-title"></div></div>
<div class="modal-scrim" id="m-imp"><div class="modal" role="dialog" aria-labelledby="imp-title" style="width:800px"></div></div>
<div class="modal-scrim" id="m-rate"><div class="modal modal--sm" role="dialog" aria-labelledby="rate-title"></div></div>

<script src="../design-system/icons.js"></script>
<script src="../design-system/shell.js"></script>
<script src="../design-system/charts.js"></script>

function showBalance(sc) { var r = newestRec(sc); return !!r && r.v !== 0; }

/* the last 12 calendar months ending with the current month (fixed window of the flows chart) */

  var out = [];

  return out;
}
function showFlows(sc) { return flowsWin(sc).some(function (m) { return m.n > 0; }); }

}

/* ===== State ===== */
var S = { sc: 'a', notes: false, fm: 11, per: 'last-month', cfrom: '', cto: '', filt: { dir: 'all', cat: '', q: '' } };
var PERIODS = [['this-month', 'Tento měsíc'], ['last-month', 'Minulý měsíc'], ['this-quarter', 'Toto čtvrtletí'], ['last-quarter', 'Minulé čtvrtletí'], ['this-year', 'Tento rok'], ['last-year', 'Minulý rok'], ['all', 'Celé období'], ['custom', 'Vlastní']];
function lastDayOf(y, m0) { return new Date(y, m0 + 1, 0); }

  var y = TODAY.getFullYear(), m = TODAY.getMonth(), q = Math.floor(m / 3);

  if (per === 'last-month') return [new Date(y, m - 1, 1), lastDayOf(y, m - 1)];
  if (per === 'this-quarter') return [new Date(y, q * 3, 1), lastDayOf(y, q * 3 + 2)];
  if (per === 'last-quarter') return [new Date(y, q * 3 - 3, 1), lastDayOf(y, q * 3 - 1)];
  if (per === 'this-year') return [new Date(y, 0, 1), new Date(y, 11, 31)];
  if (per === 'last-year') return [new Date(y - 1, 0, 1), new Date(y - 1, 11, 31)];

}
/* default ledger period: the month of the newest transaction */
function resetView() {
  var sc = cur(), win = flowsWin(sc), i;
  S.fm = 11; for (i = 11; i >= 0; i--) if (win[i].n > 0) { S.fm = i; break; }
  var nm = newestTxMonth(sc), lm = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1), tm = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  S.per = 'last-month'; S.cfrom = ''; S.cto = '';
  if (nm) {
    if (nm.y === lm.getFullYear() && nm.m === lm.getMonth() + 1) S.per = 'last-month';
    else if (nm.y === tm.getFullYear() && nm.m === tm.getMonth() + 1) S.per = 'this-month';
    else { S.per = 'custom'; S.cfrom = iso(new Date(nm.y, nm.m - 1, 1)); S.cto = iso(lastDayOf(nm.y, nm.m - 1)); }

}

/* ===== HTML builders ===== */

}

function signCls(n) { return n > 0 ? 'gain' : (n < 0 ? 'loss' : ''); }
function legendItem(swatch, text) { return '<span class="legend__item">' + swatch + text + '</span>'; }

var SW_REC = '<i class="legend__swatch legend__swatch--dot" style="background:var(--chart-line)"></i>';
function interestYear(bal, zones) {
  var t = 0;
  zones.forEach(function (z) { var hi = z.hi == null ? Infinity : z.hi; if (bal > z.lo) t += (Math.min(bal, hi) - z.lo) * z.r / 100; });
  return Math.round(t);
}
function pct2(n) { return n.toFixed(2).replace('.', ',') + ' %'; }
function pill(n, cls) { return '<i class="np ' + (cls || 'np--tl') + '">' + n + '</i>'; }

function topbarHTML(sc) {

}
function headHTML(sc) {

    '<div class="page-head"><div><div class="eyebrow">' + sc.eyebrow.map(esc).join('<span class="sep">·</span>') + '</div><h1>' + esc(sc.name) + '</h1><p>' + sc.iban + '</p></div>' +

/* ----- 1. Balance section: hero + 3 stats ----- */
function heroInner(sc) {
  var recs = desc(sc), c = recs[0], p = recs[1], delta, body = '', legend = '';
  if (p) {
    var d = c.v - p.v;
    delta = '<div class="hero__delta ' + signCls(d) + '">' + (d > 0 ? '↗ ' : (d < 0 ? '↘ ' : '→ ')) + fmtSigned(d) + '<span>od ' + fmtDay(p.date) + '</span></div>';
  } else delta = '<div class="hero__delta hero__delta--quiet"><span>Zatím jediný záznam zůstatku</span></div>';
  if (recs.length >= 2) {
    body = '<div class="chart" id="hc" style="margin:16px -4px 0;height:180px"></div><div class="chart__axis" id="hax"></div>';
    legend = '<div class="legend">' + legendItem(SW_LINE, 'Zůstatek') + legendItem(SW_REC, 'Záznam zůstatku') + pill(5, 'np--inline') + '</div>';
  }
  return '<section class="card hero"><div class="hero__head"><div><div class="hero__label">Zůstatek k ' + fmtDay(c.date) + '</div><span class="hero__value num">' + fmtKc(c.v) + '</span>' + delta + '</div></div>' + body + legend + '</section>';
}
function balanceStats(sc) {
  var recs = desc(sc), c = recs[0], s1, s2, s3, i;
  var jan1 = D(TODAY.getFullYear(), 1, 1), base = null;
  for (i = 0; i < recs.length; i++) if (!base && recs[i].date <= jan1) base = recs[i];
  if (base && base !== c) { var d1 = c.v - base.v; s1 = stat('Změna letos', fmtSigned(d1), 'proti záznamu k ' + fmtDay(base.date), signCls(d1)); }
  else s1 = stat('Změna letos', '—', 'bez záznamu k ' + fmtDay(jan1), '');
  var yearAgo = new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), TODAY.getDate()), b12 = null, short = false;
  for (i = 0; i < recs.length; i++) if (!b12 && recs[i].date <= yearAgo) b12 = recs[i];
  if (!b12 && recs.length > 1) { b12 = recs[recs.length - 1]; short = true; }
  if (b12 && b12 !== c) {
    var months = short ? Math.max(1, Math.round(dayDiff(b12.date, c.date) / 30.44)) : 12, avg = Math.round((c.v - b12.v) / months);
    s2 = stat('Průměrně za měsíc', fmtSigned(avg), short ? 'za ' + months + ' ' + pl(months, 'měsíc', 'měsíce', 'měsíců') + ' od prvního záznamu' : 'za posledních 12 měsíců', signCls(avg));
  } else s2 = stat('Průměrně za měsíc', '—', 'zatím málo záznamů', '');
  if (sc.zones) { var it = interestYear(c.v, sc.zones); s3 = stat('Roční úrok', fmtKc(it), pct2(it / c.v * 100) + ' efektivně · pásmové úročení', ''); }
  else s3 = stat('Roční úrok', '—', 'bez úročení', '');

}

/* ----- 2. Flows section: value + arrows + 12 monthly bars ----- */

  if (m.n) {

/* ----- 3. Transakce card ----- */
function selectedRange() { return rangeOf(S.per); }
function overlapFrac(m, r) {
  var a = new Date(m.y, m.m - 1, 1), b = lastDayOf(m.y, m.m - 1), dim = b.getDate();
  var lo = a > r[0] ? a : r[0], hi = b < r[1] ? b : r[1], days = dayDiff(lo, hi) + 1;
  return days <= 0 ? 0 : Math.min(1, days / dim);
}
function periodTotals(sc) {
  var r = selectedRange(), n = 0, unc = 0, newest = null;
  (sc.months || []).forEach(function (m) {
    var f = overlapFrac(m, r);
    if (f > 0 && m.n > 0) {
      n += f === 1 ? m.n : Math.max(1, Math.round(m.n * f)); unc += f === 1 ? m.unc : Math.round(m.unc * f);
      if (!newest || m.y * 100 + m.m > newest.y * 100 + newest.m) newest = m;
    }
  });
  return { n: n, unc: unc, newest: newest, range: r };
}
function ledgerData() {
  var sc = cur(), T = periodTotals(sc);
  if (!T.n) return { total: 0, rows: [], unc: 0 };
  var mo = T.newest, dim = lastDayOf(mo.y, mo.m - 1).getDate(), f = S.filt, q = f.q.trim().toLowerCase();
  var rows = sc.ledger.map(function (r) {
    return { d: Math.min(r.d, dim), m: mo.m, y: mo.y, cp: r.cp, det: r.det.replace('{mm}', p2(mo.m) + '/' + mo.y), cat: r.cat, amt: r.amt };
  }).filter(function (r) {
    var dt = new Date(r.y, r.m - 1, r.d);
    if (dt < T.range[0] || dt > T.range[1]) return false;
    if (f.dir === 'in' && r.amt < 0) return false;
    if (f.dir === 'out' && r.amt > 0) return false;
    if (f.cat && (r.cat || 'Nezařazeno') !== f.cat) return false;
    if (q && (r.cp + ' ' + r.det + ' ' + r.cat).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  return { total: T.n, rows: rows, unc: T.unc };
}
function ledgerBodyHTML() {
  var L = ledgerData(), f = S.filt, lastKey = null;
  if (!L.total) {
    return { table: '<div class="table"><div class="empty empty--wide" style="padding:36px 24px">' + icon('upload', 28) + '<h3>Žádné transakce v tomto období</h3><p>Zvolte jiné období nebo naimportujte výpis.</p></div></div>', foot: '<div class="table__foot"><span>0 transakcí</span><span></span></div>' };
  }
  var head = '<div class="table__head led-grid"><div>Datum</div><div>Protistrana</div><div>Kategorie</div><div class="cell--num">Částka</div></div>', rows = '';
  if (!L.rows.length) rows = '<div class="empty" style="padding:36px 24px"><h3>Nic neodpovídá filtru</h3><p>Zkuste jiné hledání nebo kategorii.</p></div>';
  L.rows.forEach(function (r) {
    var key = r.y + '-' + r.m + '-' + r.d;
    if (key !== lastKey) { rows += '<div class="table__group">' + r.d + '. ' + MON_G[r.m - 1] + '</div>'; lastKey = key; }
    var chip = r.cat ? '<span class="chip"><i class="dot" style="background:var(--' + (CAT_DOT[r.cat] || 's2') + ')"></i>' + r.cat + '</span>' : '<span class="badge badge--outline">' + icon('circle-alert', 11) + 'Nezařazeno</span>';
    var amt = r.amt < 0 ? '<div class="cell--num cell--name">' + fmtSigned(r.amt) + '</div>' : '<div class="cell--num delta gain">' + fmtSigned(r.amt) + '</div>';
    rows += '<div class="table__row led-grid"><div class="faint">' + r.d + '. ' + r.m + '.</div><div class="entity"><div><b>' + esc(r.cp) + '</b><small>' + esc(r.det) + '</small></div></div><div>' + chip + '</div>' + amt + '</div>';
  });
  var filtered = f.dir !== 'all' || f.cat || f.q.trim();
  var cnt = filtered ? L.rows.length + ' z ' + L.total + ' transakcí' : L.total + ' ' + pl(L.total, 'transakce', 'transakce', 'transakcí');
  return { table: '<div class="table">' + head + rows + '</div>', foot: '<div class="table__foot"><span>' + cnt + ' · Strana 1</span><span class="pager"><button type="button" class="btn btn--ghost btn--icon btn--sm" disabled aria-label="Předchozí strana">' + icon('chevron-right', 14, 'flip') + '</button><button type="button" class="btn btn--ghost btn--icon btn--sm" aria-label="Další strana">' + icon('chevron-right', 14) + '</button></span></div>' };
}
function autoBtnHTML() {

    (S.per === 'custom' ? '<input class="input" type="date" id="led-from" aria-label="Od data" value="' + S.cfrom + '"><span class="faint">–</span><input class="input" type="date" id="led-to" aria-label="Do data" value="' + S.cto + '">' : '') + '</div>';

function ledgerInner(sc) {

/* ===== Render ===== */

function sectionHTML(n, sc, sec) {
  var pre = firstSection(sec) === n ? pill(1) : '';

  if (n === 'stats') return balanceStats(sc);
  if (n === 'flows') return pre + flowsInner(sc, !sec.balance);

  return pre + emptyInner() + pill(6, 'np--tc');
}
function render() {
  var sc = cur(), sec = sectionsOf(sc), html = topbarHTML(sc) + headHTML(sc) + '<div class="stack">', names = [];
  function add(n, wrapCls) { html += '<div id="s-' + n + '"' + (wrapCls ? ' class="' + wrapCls + '"' : '') + '>' + sectionHTML(n, sc, sec) + '</div>'; }
  if (sec.balance) { add('hero', 'has-np'); add('stats'); names.push('zůstatek'); }
  if (sec.flows) { add('flows', 'has-np'); names.push('pohyby'); }
  if (sec.ledger) { add('ledger', 'has-np'); names.push('výpis'); }
  if (sec.empty) { add('empty', 'has-np'); names.push('prázdný stav'); }
  $('#page').innerHTML = html + notesInner(sc) + '</div>';
  $('#sections-name').textContent = names.join(' · ');
  drawCharts();
}
function update(names) {
  var sc = cur(), sec = sectionsOf(sc);
  names.forEach(function (n) { var el = $('#s-' + n); if (el) el.innerHTML = sectionHTML(n, sc, sec); });
  closeMenus(); drawCharts();
}
function refreshLedgerBody() {
  var b = ledgerBodyHTML();
  $('#led-body').innerHTML = b.table; $('#led-foot').innerHTML = b.foot;
  var a = $('#led-auto'); if (a) a.outerHTML = autoBtnHTML();
}

/* ===== Charts ===== */
function axisLabels(t0, t1) {
  var span = dayDiff(t0, t1), out = [];
  for (var i = 0; i < 5; i++) {
    var d = new Date(t0.getTime() + (t1 - t0) * i / 4);
    out.push(i === 4 ? 'Dnes' : (span < 100 ? shortDay(d) : CZ_MONTHS[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2)));
  }
  return out;
}
/* Balance: straight segments through the records of the last 12 months; the axis runs to today, the line stops at the newest record. */
function drawBalance(el, sc) {
  var recs = asc(sc); if (recs.length < 2) return;
  var last = recs[recs.length - 1], first = recs[0], pts = [], before = null, events = [];
  var start = new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), TODAY.getDate()); if (start < first.date) start = first.date;
  recs.forEach(function (r) { if (r.date >= start) pts.push({ date: r.date, value: r.v, rec: r }); else before = r; });
  if (before && pts.length && +pts[0].date !== +start) {
    var f = pts[0], t = (start - before.date) / (f.date - before.date);
    pts.unshift({ date: start, value: Math.round(before.v + (f.v - before.v) * t), anchor: true });
  }
  if (pts.length < 2) { el.innerHTML = ''; $('#hax').innerHTML = ''; return; }
  var gap = last.date < TODAY;
  if (gap) pts.push({ date: TODAY, value: last.v, future: true });
  pts.forEach(function (p) {
    if (p.rec && p.rec !== last) events.push({ date: p.date, type: 'out', kind: 'rec', html: '<b>' + fmtKc(p.rec.v) + '</b><small>' + fmtDay(p.date) + ' · ' + p.rec.src + '</small>' });
  });
  drawLine(el, pts, {
    axisEl: $('#hax'), height: 180, events: events, splitAt: gap ? last.date : undefined, labels: axisLabels(pts[0].date, pts[pts.length - 1].date),
    tipHtml: function (p) {
      if (p.future) return '<b>Dnes</b><small>poslední záznam ' + fmtDay(last.date) + '</small>';
      return '<b>' + fmtKc(Math.round(p.value)) + '</b><small>' + fmtDay(p.date) + (p.rec ? ' · ' + p.rec.src : ' · mezi záznamy') + '</small>';
    }
  });
  $$('path[stroke-dasharray="4 4"]', el).forEach(function (n) { n.remove(); }); /* no dashed extension: the empty gap is the message */
  $$('.ev', el).forEach(function (m) {
    var e = events[+m.getAttribute('data-i')];
    if (e && e.kind === 'rec') { m.setAttribute('fill', 'var(--chart-line)'); m.setAttribute('stroke', '#fff'); m.setAttribute('r', '4'); }
  });
}
/* Flows: 12 calendar months ending with the current month, selected month full, the others muted. */
function drawFlowBars(el, sc) {
  var win = flowsWin(sc), H = 180;
  var bars = win.map(function (m) { return { label: CZ_MONTHS[m.m - 1] + ' ' + String(m.y).slice(2), a: m.a, b: m.b }; });
  drawBars(el, bars, { axisEl: $('#hfax'), height: H, names: ['Příchozí', 'Odchozí'] });
  var svg = el.querySelector('svg'), W = +svg.getAttribute('width'), slot = (W - 54) / bars.length, slots = '', empties = '';
  bars.forEach(function (b, i) {
    slots += '<rect class="slot" data-i="' + i + '" x="' + (slot * i).toFixed(1) + '" y="0" width="' + slot.toFixed(1) + '" height="' + H + '" rx="6"/>';
    if (!b.a && !b.b) empties += '<text x="' + (slot * i + slot / 2).toFixed(1) + '" y="' + (H - 14) + '" text-anchor="middle" fill="var(--ink-5)" font-size="9" font-weight="600" style="pointer-events:none">bez importu</text>';
  });
  svg.insertAdjacentHTML('afterbegin', slots);
  svg.insertAdjacentHTML('beforeend', empties);
  $$('.bar', el).forEach(function (r) { if (+r.getAttribute('data-i') !== S.fm) r.classList.add('is-muted'); });
}
function drawCharts() {
  var sc = cur(), a = $('#hc'), b = $('#hf');
  if (a) drawBalance(a, sc);
  if (b) drawFlowBars(b, sc);
}

/* ===== Modals (opened from the ··· menu) ===== */
function closeBtn(m) { return '<button type="button" class="modal__close" aria-label="Zavřít" data-act="close" data-m="' + m + '">' + icon('x', 15) + '</button>'; }
function modalHead(id, title, sub, m) { return '<div class="modal__head"><div><h2 id="' + id + '">' + title + '</h2><p>' + sub + '</p></div>' + closeBtn(m) + '</div>'; }
function closeFoot(m) { return '<div class="modal__foot"><button type="button" class="btn btn--ghost" data-act="close" data-m="' + m + '">Zavřít</button></div>'; }

function histModalHTML(sc) {
  var recs = desc(sc), rows = '', body;
  var sub = recs.length ? recs.length + ' ' + pl(recs.length, 'záznam', 'záznamy', 'záznamů') + ' · poslední ' + fmtDay(recs[0].date) : 'Zatím žádný záznam.';
  if (!recs.length) body = '<div class="empty">' + icon('wallet', 28) + '<h3>Zatím žádný záznam</h3><p>Zaznamenejte zůstatek z výpisu nebo z bankovnictví a Moony začne vést jeho historii.</p></div>';
  else {
    recs.forEach(function (r, i) {
      var pv = recs[i + 1], chg = pv ? r.v - pv.v : null;
      rows += '<div class="table__row hist-m"><div>' + fmtDay(r.date) + '</div><div class="cell--num cell--name">' + fmtKc(r.v) + '</div>' +
        '<div class="cell--num ' + (chg == null ? 'faint' : 'delta ' + signCls(chg)) + '">' + (chg == null ? '—' : fmtSigned(chg)) + '</div>' +
        '<div><span class="badge badge--outline">' + r.src + '</span></div>' +
        '<div class="menu-host"><span class="row-actions"><button type="button" class="btn btn--ghost btn--icon btn--sm" data-act="rowmenu" data-i="' + i + '" aria-label="Možnosti záznamu">' + icon('ellipsis', 14) + '</button></span></div></div>';
    });
    body = '<div class="modal__scroll"><div class="table"><div class="table__head hist-m"><div>Datum</div><div class="cell--num">Částka</div><div class="cell--num">Změna</div><div>Zdroj</div><div></div></div>' + rows + '</div></div>';
  }
  return modalHead('hist-title', 'Historie zůstatku', sub, 'm-hist') + body + closeFoot('m-hist');
}
function impModalHTML(sc) {
  var list = sc.imports, rows = '', body;
  var sub = list.length ? 'Naposledy ' + fmtDay(list[0].date) + ' · ' + list.length + ' ' + pl(list.length, 'import', 'importy', 'importů') : 'Zatím žádný import.';
  if (!list.length) body = '<div class="empty">' + icon('upload', 28) + '<h3>Zatím žádný import</h3><p>Naimportujte výpis z banky a jeho historie se objeví tady.</p></div>';
  else {
    list.forEach(function (m) {
      rows += '<div class="table__row imp-m"><div>' + fmtDay(m.date) + '</div><div class="cell--name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.file) + '</div>' +
        '<div class="faint">' + shortDay(m.from) + ' – ' + fmtDay(m.to) + '</div><div class="cell--num">' + m.n + '</div><div class="cell--num ' + (m.dup ? '' : 'faint') + '">' + m.dup + '</div>' +
        '<div class="cell--num"><span class="row-actions"><button type="button" class="btn btn--danger btn--sm" data-act="noop">Smazat importované transakce…</button></span></div></div>';
    });
    body = '<div class="modal__scroll"><div class="table"><div class="table__head imp-m"><div>Datum</div><div>Soubor</div><div>Období</div><div class="cell--num">Importováno</div><div class="cell--num">Duplicity</div><div></div></div>' + rows + '</div></div>';
  }
  return modalHead('imp-title', 'Historie importů', sub, 'm-imp') + body + closeFoot('m-imp');
}
function rateModalHTML(sc) {
  var rows = '';
  sc.zones.forEach(function (z) {
    var lab = z.lo === 0 ? '0 – ' + numOnly(z.hi) + ' Kč' : (z.hi == null ? 'nad ' + numOnly(z.lo) + ' Kč' : numOnly(z.lo) + ' – ' + numOnly(z.hi) + ' Kč');
    rows += '<div class="kv"><span>' + lab + '</span><b>' + pct2(z.r) + '</b></div>';
  });
  return modalHead('rate-title', 'Úročení', 'Pásmové úročení podle výše zůstatku', 'm-rate') + '<div class="modal__body">' + rows + '<p class="rate-cap">Efektivní sazba: roční úrok z aktuálního zůstatku dělený zůstatkem.</p></div>' + closeFoot('m-rate');
}
function openHist() { closeMenus(); $('#m-hist .modal').innerHTML = histModalHTML(cur()); openModal('m-hist'); }
function openImports() { closeMenus(); $('#m-imp .modal').innerHTML = impModalHTML(cur()); openModal('m-imp'); }
function openRate() { if (!cur().zones) return; closeMenus(); $('#m-rate .modal').innerHTML = rateModalHTML(cur()); openModal('m-rate'); }
function recNote() {
  var v = $('#rec-date').value, hit = null, note = $('#rec-note');
  cur().records.forEach(function (r) { if (iso(r.date) === v) hit = r; });
  if (hit) { note.innerHTML = icon('info', 13) + 'Záznam ze dne ' + fmtDay(hit.date) + ' bude nahrazen.'; note.hidden = false; } else note.hidden = true;
}
function openRec() {
  $('#rec-amt').value = '';
  $('#rec-date').value = iso(TODAY);
  recNote(); closeMenus(); openModal('m-rec');
}

/* ===== Menus ===== */
function closeMenus() { $$('.menu').forEach(function (m) { m.remove(); }); }
function openMenu(btn, items) {
  var host = btn.closest('.menu-host'), had = host.querySelector('.menu'), inModal = !!btn.closest('.modal');
  closeMenus(); if (had) return;
  host.insertAdjacentHTML('beforeend', '<div class="menu" role="menu">' + items.map(function (it) {
    if (!it) return '<div class="menu__sep"></div>';
    return '<button type="button" role="menuitem" class="menu__item' + (it.danger ? ' menu__item--danger' : '') + '" data-act="' + (it.act || 'noop') + '"' + (it.i != null ? ' data-i="' + it.i + '"' : '') + '>' + icon(it.ic, 14) + it.label + '</button>';
  }).join('') + '</div>');
  if (inModal) { /* menus inside a scrolling modal body are placed on the viewport so they are not clipped */
    var m = host.querySelector('.menu'), r = btn.getBoundingClientRect();
    m.style.position = 'fixed'; m.style.right = 'auto'; m.style.left = Math.round(r.right - m.offsetWidth) + 'px';
    var below = r.bottom + 4; m.style.top = Math.round(below + m.offsetHeight > window.innerHeight - 8 ? r.top - m.offsetHeight - 4 : below) + 'px';
  }
}
/* The page menu is static and holds only what is not already in the head. */
function pageMenu(sc) {
  var items = [{ ic: 'pencil', label: 'Upravit účet' }, { ic: 'plus', label: 'Přidat transakci', act: 'addtx' }, { ic: 'chart-line', label: 'Historie zůstatku', act: 'hist' }, { ic: 'file-text', label: 'Historie importů', act: 'imports' }];
  if (sc.zones) items.push({ ic: 'landmark', label: 'Úročení', act: 'rate' });
  items.push({ ic: 'tag', label: 'Pravidla kategorizace' }, null, { ic: 'trash-2', label: 'Smazat účet', danger: true });
  return items;
}

/* ===== Events ===== */
function syncUrl() {
  try { history.replaceState(null, '', '?scenario=' + S.sc + (S.notes ? '&notes=1' : '')); } catch (e) { /* file:// may refuse */ }
}
function setScenario(id) {
  S.sc = id; resetView();
  $$('#scn .seg__btn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-value') === id); });
  render(); syncUrl();
}
document.addEventListener('click', function (e) {
  var link = e.target.closest('a[href="#"]'); if (link) e.preventDefault();
  var t = e.target.closest('[data-act]'), act = t && t.getAttribute('data-act');
  if (act !== 'menu' && act !== 'rowmenu') closeMenus();
  var sl = e.target.closest('#hf [data-i]');
  if (!act && sl) { S.fm = +sl.getAttribute('data-i'); update(['flows']); return; }
  if (!act) return;
  if (act === 'rec') openRec();
  else if (act === 'close') closeModal(t.getAttribute('data-m'));
  else if (act === 'hist') openHist();
  else if (act === 'imports') openImports();
  else if (act === 'rate') openRate();
  else if (act === 'menu') openMenu(t, pageMenu(cur()));
  else if (act === 'rowmenu') openMenu(t, [{ ic: 'trash-2', label: 'Smazat záznam', danger: true, act: 'delrec', i: t.getAttribute('data-i') }]);
  else if (act === 'delrec') {
    var sc = cur(), r = desc(sc)[+t.getAttribute('data-i')]; sc.records = sc.records.filter(function (x) { return x !== r; });
    render(); if ($('#m-hist').classList.contains('is-open')) $('#m-hist .modal').innerHTML = histModalHTML(cur()); toast('Záznam smazán');
  }
  else if (act === 'pprev' && S.fm > 0) { S.fm--; update(['flows']); }
  else if (act === 'pnext' && S.fm < 11) { S.fm++; update(['flows']); }
});
document.addEventListener('segchange', function (e) {
  var name = e.target.getAttribute('data-seg'), v = e.detail;
  if (name === 'scn') setScenario(v);
  else if (name === 'dir') { S.filt.dir = v; refreshLedgerBody(); }
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'led-q') { S.filt.q = e.target.value; refreshLedgerBody(); }
  else if (id === 'led-from') { S.cfrom = e.target.value; refreshLedgerBody(); }
  else if (id === 'led-to') { S.cto = e.target.value; refreshLedgerBody(); }
  else if (id === 'rec-date') recNote();
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 'led-cat') { S.filt.cat = e.target.value; refreshLedgerBody(); }
  else if (id === 'led-per') {
    var v = e.target.value;
    if (v === 'custom' && S.per !== 'custom') { var r = rangeOf(S.per === 'all' ? 'last-month' : S.per); S.cfrom = iso(r[0]); S.cto = iso(r[1]); }
    S.per = v; $('#led-sub').innerHTML = ledgerSubHTML(); refreshLedgerBody();
  }
  else if (id === 'led-from') { S.cfrom = e.target.value; refreshLedgerBody(); }
  else if (id === 'led-to') { S.cto = e.target.value; refreshLedgerBody(); }
  else if (id === 'rec-date') recNote();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(); });
document.addEventListener('scroll', closeMenus, true);
$('#notes-toggle').addEventListener('change', function (e) { S.notes = e.target.checked; document.body.classList.toggle('notes-on', S.notes); syncUrl(); });
$('#rec-x').innerHTML = icon('x', 15);
$('#rec-x').addEventListener('click', function () { closeModal('m-rec'); });
$('#rec-cancel').addEventListener('click', function () { closeModal('m-rec'); });
$('#rec-ok').addEventListener('click', function () { closeModal('m-rec'); toast('Zůstatek zaznamenán'); });
var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(drawCharts, 120); });

/* ===== Init ===== */
(function init() {
  var q = new URLSearchParams(location.search), id = q.get('scenario');
  if (!SC[id]) id = 'a';
  renderShell({ active: 'bankAccounts' });
  if (q.get('notes') === '1') { S.notes = true; $('#notes-toggle').checked = true; document.body.classList.add('notes-on'); }
  S.sc = id; resetView();
  $$('#scn .seg__btn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-value') === id); });
  render();
  var md = q.get('modal');
  if (md === '1' || md === 'rec') { openRec(); if (q.get('date')) { $('#rec-date').value = q.get('date'); recNote(); } }
  else if (md === 'hist') openHist();
  else if (md === 'imports') openImports();
  else if (md === 'rate') openRate();
  if (q.get('menu') === '1') openMenu($('[data-act=menu]'), pageMenu(cur()));
})();
})();
</script>
