<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moony — Analýza akcií: výkonnost štítků (návrh)</title>
<link rel="stylesheet" href="../design-system/moony.css">
<style>
  /* Prototype-only styles. Everything else comes from the design system. */
  html { overflow-y: scroll; }
  .sidebar { top: 42px; height: calc(100vh - 42px); }

  /* Prototype bar (above the app) */
  .proto-bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 18px; height: 42px; padding: 0 20px; background: var(--dark-grad); box-shadow: var(--sh-dark); color: var(--ink-inverse-2); font-size: 11px; font-weight: 600; }
  .proto-bar__tag { padding: 3px 7px; border-radius: 5px; background: rgba(255,255,255,.14); color: #fff; font-size: 9px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  .proto-bar__title { color: #fff; font-weight: 650; letter-spacing: -.01em; }
  .proto-bar__spacer { flex: 1; }
  .proto-bar .seg { background: rgba(255,255,255,.11); }
  .proto-bar .seg__btn { color: var(--ink-inverse-2); transition: none; }
  .proto-bar .seg__btn:hover { color: #fff; }
  .proto-bar .seg__btn.is-active { background: var(--paper); color: var(--ink); box-shadow: none; }
  .proto-bar__toggle { display: inline-flex; align-items: center; gap: 10px; color: #fff; cursor: pointer; }
  .proto-bar .switch input { background: rgba(255,255,255,.22); }
  .proto-bar .switch input:checked { background: #f4f2ec; }
  .proto-bar .switch input:checked::after { background: var(--dark); }
  .proto-bar__hint { font-weight: 500; }
  @media (max-width: 1360px) { .proto-bar__hint--long { display: none; } }

  /* Design-note callouts */
  .has-np { position: relative; }
  .np { position: absolute; z-index: 4; display: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--dark-grad); box-shadow: var(--sh-dark), 0 0 0 2px var(--canvas); color: #fff; font-size: 10px; font-weight: 700; font-style: normal; line-height: 20px; text-align: center; pointer-events: none; letter-spacing: 0; text-transform: none; }
  .notes-on .np { display: block; }
  .np--tl { left: -10px; top: -10px; }
  .np--tr { right: -10px; top: -10px; }
  .np--inline { position: static; margin-left: 8px; vertical-align: middle; }
  .notes-on .np--inline { display: inline-block; }
  .notes-card { display: none; }
  .notes-on .notes-card { display: block; }
  .notes { display: grid; grid-template-columns: 1fr 1fr; column-gap: 44px; margin: 0; padding: 0 21px 10px; list-style: none; }
  .notes li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 13px 0; border-top: 1px solid var(--line-soft); color: var(--ink-2); font-size: var(--fs-table); line-height: 1.55; }
  .notes li:nth-child(-n+2) { border-top: 0; }
  .notes .np { position: static; display: inline-block; margin-top: 1px; box-shadow: var(--sh-dark); }
  .notes b { display: block; color: var(--ink); font-weight: 650; }
  .notes .badge { margin-top: 6px; }
  .notes-on .hero, .notes-on .card--table { overflow: visible; }

  /* Page */
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-bottom: 18px; }
  .filters__group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .filters__group .eyebrow { margin: 0 4px 0 0; }
  .filters .chip { cursor: pointer; }
  .filters__clear, .link { background: none; border: 0; padding: 0; color: var(--ink-2); font-size: var(--fs-caption); font-weight: 650; text-underline-offset: 3px; cursor: pointer; }
  .filters__clear:hover, .link:hover { color: var(--ink); text-decoration: underline; }
  .filters__untagged { margin-left: auto; color: var(--ink-3); font-size: var(--fs-caption); font-weight: 500; }
  .filters__untagged .link { margin-left: 6px; }

  /* Hero: time-weighted return, money-weighted return, change of value */
  .hero--twr { padding: 22px 24px 0; }
  .hero__figs { display: flex; align-items: flex-start; gap: 28px; }
  .hero__fig + .hero__fig { padding-left: 28px; border-left: 1px solid var(--line-soft); }
  .hero__fig { min-width: 0; }
  .hero--twr .hero__label { display: flex; align-items: center; }
  .hero--twr .hero__value { margin: 8px 0 6px; }
  .hero--twr .hero__value--sm { margin: 10px 0 7px; font-size: var(--fs-stat); letter-spacing: -0.05em; }
  .hero--twr .hero__delta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
  .hero--twr .hero__delta .sep { color: var(--ink-5); font-weight: 450; }
  .hero--twr .hero__delta span.faint { margin: 0; }
  .hero__when { margin-top: 5px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .hero__when b { color: var(--ink-3); font-weight: 650; }
  .hero__note { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; line-height: 1.65; white-space: nowrap; }
  .hero__note b { color: var(--ink-2); font-weight: 650; }
  .hero > .toolbar { z-index: 3; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 18px; margin-top: 20px; }
  .toolbar__group { display: flex; align-items: center; gap: 10px; }
  .ctl-label { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 600; }
  .seg__sep { align-self: center; width: 1px; height: 14px; margin: 0 4px; background: var(--line-strong); }
  .menu-host { position: relative; }
  .menu-host .menu { top: calc(100% + 6px); right: 0; }
  .menu-host .menu[hidden] { display: none; }
  .menu__item small { margin-left: auto; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .menu__item .ic-check { width: 14px; color: var(--ink); }
  .btn--sm .ic { width: 13px; height: 13px; }
  .btn.is-on { border-color: var(--focus-border); color: var(--ink); }

  .twr { position: relative; margin: 14px -4px 0; }
  .twr svg { display: block; width: 100%; overflow: visible; }
  .twr .ln, .twr .ev-ring { transition: opacity var(--t-fast); }
  .twr.is-dim .ln:not(.is-hot), .twr.is-dim .ev-ring:not(.is-hot) { opacity: .25; }
  .twr__labels { position: absolute; top: 0; right: 0; pointer-events: none; }
  .twr__label { position: absolute; left: 10px; display: inline-flex; align-items: center; gap: 6px; transform: translateY(-50%); white-space: nowrap; color: var(--ink-2); font-size: var(--fs-micro); font-weight: 650; font-variant-numeric: tabular-nums; pointer-events: auto; cursor: default; transition: opacity var(--t-fast); }
  .twr__label i { width: 7px; height: 7px; border: 2px solid var(--chart-line); border-radius: 50%; background: var(--paper); flex: none; }
  .twr__label.is-ref i { width: 11px; height: 0; border: 0; border-top: 2px dashed var(--chart-line); border-radius: 0; }
  .twr__label.is-idx i { width: 11px; height: 0; border: 0; border-top: 2px dotted var(--ink-4); border-radius: 0; }
  .twr.is-dim .twr__label:not(.is-hot) { opacity: .35; }
  .twr .hit { cursor: crosshair; }
  .taxis { position: relative; height: 16px; margin: 6px -4px 0; color: var(--chart-axis); font-size: var(--fs-micro); font-weight: 500; }
  .taxis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .taxis span.is-last { transform: translateX(-100%); color: var(--ink-3); font-weight: 600; }
  .taxis span.is-year { color: var(--ink-3); font-weight: 650; }

  /* Scoreboard under the chart: the legend with numbers */
  .board { margin: 16px -24px 0; border-top: 1px solid var(--line-soft); }
  .board__head, .board__row { display: grid; grid-template-columns: 22px minmax(0, 1.25fr) 116px 112px 84px 92px minmax(0, 1fr) 118px; align-items: center; gap: 0 14px; padding: 0 24px; }
  .board__head { height: 34px; white-space: nowrap; color: var(--ink-4); font-size: var(--fs-thead); font-weight: var(--fw-thead); letter-spacing: var(--ls-thead); text-transform: uppercase; }
  .board__row { min-height: 40px; border-top: 1px solid var(--line-soft); color: var(--ink-2); font-size: var(--fs-table); cursor: default; transition: background var(--t-fast); }
  .board__row.is-clickable { cursor: pointer; }
  .board__row:hover, .board__row.is-hot { background: var(--well); }
  .board__row.is-quiet:hover { background: transparent; }
  .board__row .nm { min-width: 0; padding: 7px 0; }
  .board__row .nm b { display: block; overflow: hidden; color: var(--ink); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .board__row .nm small { display: block; margin-top: 2px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; white-space: nowrap; }
  .board__row .nm .pos { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .board__row .r, .board__head .r { text-align: right; }
  .board__row .num { font-variant-numeric: tabular-nums; }
  .board__row .twr-v { font-weight: 650; }
  .board__row .dim { color: var(--ink-4); }
  .board__row.is-quiet .nm b, .board__row.is-quiet .twr-v { color: var(--ink-3); font-weight: 600; }
  .board__cap { margin: 0; padding: 10px 24px 13px; border-top: 1px solid var(--line-soft); color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .sw { display: block; width: 14px; height: 2.5px; border-radius: 1px; background: var(--chart-line); }
  .sw--dash { background: repeating-linear-gradient(90deg, var(--chart-line) 0 3px, transparent 3px 5px); }
  .sw--dot { height: 2px; background: repeating-linear-gradient(90deg, var(--ink-4) 0 2px, transparent 2px 4px); }
  .sw--none { height: 8px; width: 8px; border: 1px solid var(--line-strong); border-radius: 2px; background: repeating-linear-gradient(135deg, transparent 0 2px, var(--line-strong) 2px 3px); }
  .share { display: flex; align-items: center; gap: 10px; }
  .share .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--well-3); overflow: hidden; }
  .share .bar i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
  .share span { width: 40px; text-align: right; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Contribution card */
  .card--fill { display: flex; flex-direction: column; }
  .card--fill .card__head { align-items: flex-start; }
  .crows { flex: 1; display: flex; flex-direction: column; }
  .crow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) 84px; gap: 14px; align-items: center; min-height: 40px; padding: 0 21px; border-top: 1px solid var(--line-soft); color: var(--ink-2); font-size: var(--fs-table); }
  .crow .entity b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .entity .logo { width: 24px; height: 24px; font-size: 8.5px; }
  .crow__name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .crow__name b { overflow: hidden; color: var(--ink); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .crow__name small { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; white-space: nowrap; }
  .ctrack { position: relative; height: 16px; }
  .ctrack .zero { position: absolute; top: -12px; bottom: -12px; width: 1px; background: var(--line-strong); }
  .ctrack .cbar { position: absolute; top: 4px; height: 8px; border-radius: 2px; background: var(--s2); }
  .ctrack .cbar.is-neg { background: var(--s3); }
  .cval { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .crow--foot { margin-top: auto; background: var(--well); border-top: 1px solid var(--line); border-radius: 0 0 var(--r-4) var(--r-4); }
  .crow--foot .crow__name b { font-weight: 700; }
  .crow--muted .crow__name b { color: var(--ink-3); font-weight: 600; }

  /* Deposits and market card */
  .bridge { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 21px; border: 1px solid var(--line-soft); border-radius: var(--r-2); background: var(--paper); }
  .bridge div { padding: 10px 12px 11px; }
  .bridge div + div { border-left: 1px solid var(--line-soft); }
  .bridge small { display: block; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 600; }
  .bridge b { display: block; margin-top: 4px; color: var(--ink); font-size: 14px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fbars { position: relative; flex: 1 1 auto; min-height: 168px; margin: 18px 17px 0; }
  .fbars svg { display: block; width: 100%; overflow: visible; }
  .fbars .slot:hover rect.bg { fill: var(--well); }
  .baxis { position: relative; height: 16px; margin: 6px 17px 0; color: var(--chart-axis); font-size: var(--fs-micro); font-weight: 500; }
  .baxis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .card--fill .legend { margin: 10px 21px 18px; }

  /* Allocation ring (optional variant) */
  .ring-wrap { display: flex; align-items: center; gap: 36px; padding: 6px 21px 22px; }
  .ring--lg { width: 184px; height: 184px; flex: none; }
  .ring--lg::after { inset: 30px; }
  .ring--lg .ring__center { font-size: 10px; }
  .ring--lg .ring__center b { font-size: 18px; }
  .ring-legend { flex: 1; display: grid; }
  .ring-legend div { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 12px; align-items: center; height: 32px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); font-size: var(--fs-table); }
  .ring-legend div:last-child { border-bottom: 0; }
  .ring-legend i { width: 8px; height: 8px; border-radius: 50%; }
  .ring-legend b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  .ring-legend .pct { width: 36px; text-align: right; color: var(--ink-3); font-weight: 600; }

  /* Tables */
  .tags-table .table__head, .tags-table .table__row { grid-template-columns: 2fr .7fr 1.1fr .7fr 1.1fr 1.1fr 1.1fr; }
  .tags-table.is-narrow .table__head, .tags-table.is-narrow .table__row { grid-template-columns: 1.4fr .55fr 1fr .55fr 1.45fr; }
  .tags-table.is-narrow .table__head { white-space: nowrap; }
  .tags-table .table__row { min-height: 48px; }
  .hold-table .table__head, .hold-table .table__row { grid-template-columns: 2.1fr 1.5fr 1fr 1fr 1.2fr 40px; column-gap: 16px; }
  .hold-table .table__row { min-height: 58px; }
  .tag-name { display: inline-flex; align-items: center; gap: 8px; }
  .tag-name .grp { color: var(--ink-4); font-size: 10px; font-weight: 500; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .table__row .btn--icon { width: 28px; height: 28px; }
  .card__head .search { width: 220px; }
  .conc { border-bottom: 1px dotted var(--ink-5); cursor: help; }

  /* Round 4: the scope card and the split caption explain the two controls */
  .scope { margin-bottom: 18px; padding: 15px 18px 12px; }
  .scope__head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 11px; }
  .scope__head h2 { margin: 0; font-size: var(--fs-h3); font-weight: var(--fw-h3); letter-spacing: var(--ls-h3); }
  .scope__sum { color: var(--ink-3); font-size: var(--fs-caption); font-weight: 500; white-space: nowrap; }
  .scope__sum b { color: var(--ink); font-weight: 650; }
  .scope__sum .link { margin-left: 10px; }
  .scope .filters { margin-bottom: 0; }
  .scope__foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .scope__hint { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; line-height: 1.55; }
  .scope__hint b { color: var(--ink-2); font-weight: 650; }
  .scope .filters__untagged { margin-left: 0; white-space: nowrap; }
  .subbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-top: 12px; }
  .split-cap { display: flex; gap: 7px; align-items: flex-start; max-width: 600px; color: var(--ink-3); font-size: var(--fs-micro); font-weight: 500; line-height: 1.55; }
  .split-cap .ic { flex: none; margin-top: 1px; color: var(--ink-4); }
  .split-cap b { color: var(--ink-2); font-weight: 650; }
  .period-range { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
  .period-range__inputs { display: flex; align-items: center; gap: 8px; }
  .period-range__inputs .input { width: 140px; height: 35px; font-size: var(--fs-table); }
  .period-range__inputs .arrow { color: var(--ink-5); }
  .period-range__hint { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .period-range .field__error { margin-top: 0; }
  .period-range [hidden] { display: none; }
  .card__head .seg { flex: none; }
  .seg__btn { white-space: nowrap; }

  /* Round 3: custom range, conflict alert, assign dialog */
  .range-row { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .range-row .input { width: 140px; height: 35px; font-size: var(--fs-table); }
  .range-row .arrow { color: var(--ink-5); }
  .range-row .hint { margin-right: auto; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .range-row .field__error { width: 100%; justify-content: flex-end; margin-top: 0; }
  .range-row .field__error[hidden] { display: none; }
  .twr .hit.is-dragging { cursor: ew-resize; }
  .conflict { margin: -4px 0 18px; align-items: center; }
  .conflict .actions { margin-left: auto; }
  .badge--muted { background: none; border: 1px dashed var(--line-strong); color: var(--ink-4); text-decoration: line-through; text-decoration-color: var(--ink-5); }
  .warn { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: var(--fs-micro); font-weight: 650; }
  .warn .ic { color: var(--ink-3); }
  .badges .link { font-size: var(--fs-micro); }

  .modal--assign { width: 640px; }
  .modal--assign .modal__head { position: relative; }
  .as-list { max-height: 196px; overflow-y: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: var(--r-2); }
  .as-row { display: grid; grid-template-columns: 18px 26px 1fr auto; gap: 10px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--line-soft); font-size: var(--fs-table); cursor: pointer; }
  .as-row:first-child { border-top: 0; }
  .as-row:hover { background: var(--well); }
  .as-row .logo { width: 24px; height: 24px; font-size: 8.5px; }
  .as-row b { display: block; color: var(--ink); font-weight: 650; }
  .as-row small { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .as-row .cur { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; text-align: right; }
  .as-group { display: grid; grid-template-columns: 132px 1fr; gap: 10px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line-soft); }
  .as-group:first-of-type { border-top: 0; }
  .as-group__label b { display: block; color: var(--ink-2); font-size: var(--fs-caption); font-weight: 700; }
  .as-group__label small { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .as-group .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .as-group .chip { cursor: pointer; }
  .as-group .chip--quiet { border-style: dashed; color: var(--ink-3); }
  .as-group .chip--quiet.is-active { border-style: solid; }
  .as-note { grid-column: 2; display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: var(--fs-micro); font-weight: 600; }
  .as-note .ic { color: var(--ink-3); }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="proto-bar__tag">Návrh</span>
  <span class="proto-bar__title">Analýza akcií · výkonnost v celé šířce</span>
  <span class="proto-bar__hint">Prstenec rozdělení:</span>
  <div class="seg" id="ring-seg">
    <button type="button" class="seg__btn is-active" data-value="off">Vypnutý (doporučeno)</button>
    <button type="button" class="seg__btn" data-value="on">Zapnutý</button>
  </div>
  <span class="proto-bar__hint proto-bar__hint--long">Najeďte myší na graf a čísla se přepíší k danému dni · tažením vyberete vlastní období</span>
  <span class="proto-bar__spacer"></span>
  <label class="proto-bar__toggle"><span>Poznámky k návrhu</span><span class="switch"><input type="checkbox" id="notes-toggle"></span></label>
</div>

<div class="app">
  <aside class="sidebar"></aside>
  <main class="page" id="page"></main>
</div>

<div class="modal-scrim" id="m-assign">
  <form class="modal modal--assign" onsubmit="return false" aria-labelledby="as-title">
    <div class="modal__head has-np">
      <i class="np np--tl">19</i>
      <div><h2 id="as-title">Přiřadit štítky</h2><p>Vyberte pozice a štítky, které jim chcete dát.</p></div>
      <button type="button" class="modal__close" aria-label="Zavřít" data-close></button>
    </div>
    <div class="modal__body" id="as-body"></div>
    <div class="modal__foot">
      <button type="button" class="btn btn--ghost" data-close>Zrušit</button>
      <div class="actions"><button type="button" class="btn btn--primary" id="as-save">Přiřadit štítky</button></div>
    </div>
  </form>
</div>

<script src="../design-system/icons.js"></script>
<script src="../design-system/shell.js"></script>
<script src="../design-system/charts.js"></script>
<script>
(function () {
'use strict';

/* ===== Helpers ===== */

  var y = function (v) { return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); };

  list.forEach(function (bk, i) {

      bar(bk.dep, cx - bw - 1, 'var(--s3)') + bar(bk.mkt, cx + 1, 'var(--s1)') + '</g>';

    });

  });

  { n: 7, t: 'Srovnání s indexem (volitelné, mění backend)', s: 'Tečkovaná čára S&P 500 nebo MSCI World přes zvolený ETF a hero věta „o x p. b. před indexem / za indexem“. Jediná část návrhu, která potřebuje nová data: denní historii indexu stáhnout z Yahoo a uložit (migrace, tabulka, volba indexu zapamatovaná pro stránku).' },
  { n: 8, t: 'Období: předvolby a vlastní od–do', s: '3 měsíce · Letos · Rok · 3 roky · Vše · Vlastní. Vlastní ukáže pole Od a Do (stejně jako pohyby na bankovním účtu), úsek jde vybrat i tažením myší v grafu. Od nesmí být před prvním nákupem, Do po dnešku, Od musí být před Do. Celá stránka se řídí obdobím: výnosy, příspěvky, vklady i hodnoty, které se ukazují k datu Do. Nerealizovaný zisk a dividendy zůstávají k dnešku a v hlavičce to říkají. Vlastní období si stránka pamatuje.' },
  { n: 9, t: 'Propad od maxima', s: 'Panel pod výnosem sdílí časovou osu a ukazuje, jak hluboko pod předchozím vrcholem byla každá čára; portfolio má plochu. Sloupec Max. propad v tabulce. Počítá se z TWR řad na frontendu.' },
  { n: 10, t: 'Tabulka pod grafem je legenda', s: 'Řádek na štítek: barva čáry, výnos za období, rozdíl proti portfoliu, příspěvek k výnosu portfolia, největší propad, podíl na hodnotě a hodnota. Graf kreslí nejvýš 4 čáry, další štítky a Bez štítku jsou jen v tabulce (šrafovaná značka). Najetí zvýrazní čáru, klepnutí na ruční štítek zapne filtr.' },
  { n: 11, t: 'Které pozice analyzovat', s: 'Výběr pozic je vlastní karta: nadpis říká, co dělá, vpravo je souhrn (Všech 9 pozic, nebo 2 z 9 pozic a Zrušit výběr) a pod čipy věta s pravidlem. Ve skupině se volí jeden štítek nebo Vše, štítky ze dvou skupin platí zároveň. Při aktivním výběru věta vyjmenuje zvolené štítky a připomene, že horní čísla a čárkovaná čára zůstávají za celé portfolio. Od čtvrté skupiny se další schovají pod Další filtry. Vpravo dole počet pozic bez štítku s odkazem.' },
  { n: 12, t: 'Příspěvek k výnosu', s: 'Kolik p. b. z výnosu portfolia přinesla každá pozice, nebo každá část skupiny; součet dává výnos portfolia. Malá pozice s velkým výnosem portfolio skoro nepohne a tady je to vidět. Přepínač Pozice / Podle skupiny: druhá volba bere skupinu z Rozdělit podle a podtitulek ji jmenuje („přinesl každý štítek skupiny Strategie“). S filtrem ukazuje vybrané pozice a kolik z výnosu portfolia výběr přinesl.' },
  { n: 13, t: 'Vklady a zhodnocení v čase', s: 'Čisté vklady a zhodnocení trhu po týdnech, měsících, čtvrtletích nebo letech podle délky období. Je vidět, kdy jste vkládali a jestli do propadu, nebo do růstu. Nad grafem hodnota na začátku a na konci období. Vždy za celé portfolio.' },
  { n: 14, t: 'Tabulka Štítky', s: 'Výnos za období (TWR) a Nerealizovaný zisk od nákupu vedle sebe. U štítků ze skupiny je jméno skupiny a podíly ve skupině dají 100 %; štítky bez skupiny jsou označené „bez skupiny“ a mohou se překrývat.' },
  { n: 15, t: 'Pozice: výnos za období a koncentrace', s: 'Sloupec Výnos za období (vyžaduje TWR jedné pozice v backendu). Podtitulek ukazuje podíl pěti největších pozic a efektivní počet pozic; ETF se počítá jako jedna pozice, proto jen informace bez varování. Pod tickerem měna a sektor.' },
  { n: 16, t: 'Prstenec rozdělení je volitelný', s: 'Doporučení: vypnout. Sloupec Podíl v tabulce pod grafem ukazuje totéž rozdělení. Zapnutý prstenec (přepínač v liště návrhu) sedí vedle zúžené tabulky Štítky.' },
  { n: 17, t: 'Skupina je jedno rozdělení portfolia', s: 'Rozhodnutí: pozice má v každé skupině nejvýš jeden štítek. Nic se nedělí ani nepočítá dvakrát: podíly dají 100 %, příspěvky se sečtou na výnos portfolia a čára TWR štítku bere celé pozice jako dnes backend. Překrývající se označení patří do dvou skupin nebo mezi štítky bez skupiny. Platí i pro filtr: pozice patří jen pod svůj štítek.' },
  { n: 18, t: 'Migrace starších dat', s: 'Rozhodnutí: pozice, které dnes mají ve skupině víc štítků, srovná migrace při aktualizaci. Zůstane první přiřazený štítek (podle data přiřazení, při shodě podle názvu štítku), ostatní přiřazení se smažou a štítky samotné zůstanou. Stránka proto nemá žádné upozornění ani výjimku ve výpočtu. V ukázce měl ČEZ Dividendy i Hodnota, po migraci má Dividendy.' },
  { n: 19, t: 'Vynucení pravidla', s: 'Dialog Přiřadit štítky nabízí ve skupině jednu volbu, která nahradí dosavadní štítek; u víc pozic je výchozí Beze změny a štítky bez skupiny lze vybrat víc. Backend druhý štítek stejné skupiny při ukládání odmítne. Spravovat štítky odmítne přesunout štítek do skupiny, ve které by tím některá pozice měla dva štítky, a dotčené pozice vyjmenuje.' }
];
function notesHTML() {
  return '<section class="card card--flat notes-card"><div class="card__head"><div><h2 class="card__title">Poznámky k návrhu</h2><p class="card__sub">Čísla odpovídají značkám na stránce</p></div></div><ol class="notes">' +
    NOTES.map(function (x) {
      var where = x.n === 16 && !state.ring ? 'vidět se zapnutým prstencem' : (x.n === 19 ? 'vidět v dialogu Přiřadit štítky' : (x.n === 18 ? 'běží jednou při aktualizaci, na stránce není' : ''));
      return '<li><i class="np">' + x.n + '</i><div><b>' + x.t + '</b>' + x.s + (where ? '<br><span class="badge badge--outline">' + where + '</span>' : '') + '</div></li>';
    }).join('') + '</ol></section>';
}

var current;
function render() {
  var m = current = model(), yScroll = window.scrollY;
  var html = topbarHTML() + headHTML() + filtersHTML(m) + '<div class="stack">' + heroHTML(m) +
    '<div class="two">' + contribHTML(m) + flowsHTML(m) + '</div>';
  html += state.ring ? '<div class="two">' + ringHTML(m) + tagsTableHTML(m, true) + '</div>' : tagsTableHTML(m, false);
  html += holdingsHTML(m) + notesHTML() + '</div>';
  $('#page').innerHTML = html;
  $('#board').innerHTML = boardHTML(m);
  heroText(m, null);
  var lines = m.rows.filter(function (r) { return r.drawn; }).concat([m.portfolio]).concat(m.index ? [m.index] : []);
  drawTwr($('#twr'), m.dates, lines, {
    axisEl: $('#taxis'), lastLabel: m.atToday ? 'Dnes' : fmtDay(m.rg.to),
    onScrub: function (i) { heroText(m, i); updateBoard(m, i); },
    onLeave: function () { heroText(m, null); updateBoard(m, null); },
    onRange: function (from, to) { state.period = 'custom'; state.custom = { from: from, to: to }; state.rangeError = null; render(); }
  });
  drawFlowBars($('#fbars'), $('#baxis'), buckets(m).list);
  if (state.ring) drawRing($('#ring'), m.rows.concat(m.none ? [m.none] : []).map(function (r) { return { pct: r.share * 100, color: r.drawn ? r.color : 'var(--s-other)' }; }));
  bind(m);
  window.scrollTo(0, yScroll);
}
function bind(m) {
  $('#seg-group').addEventListener('segchange', function (e) { state.group = e.detail; render(); });
  $('#seg-period').addEventListener('segchange', function (e) {
    if (e.detail === 'custom' && !state.custom) state.custom = { from: m.rg.from, to: m.rg.to };
    state.period = e.detail; state.rangeError = null; render();
  });
  $('#seg-cmode').addEventListener('segchange', function (e) { state.cmode = e.detail; render(); });
  $$('.filters .chip').forEach(function (c) {
    c.addEventListener('click', function () { if (c.dataset.tag === 'all') delete state.filters[c.dataset.filter]; else state.filters[c.dataset.filter] = c.dataset.tag; render(); });
  });
  var clear = $('[data-act="clear"]'); if (clear) clear.addEventListener('click', function () { state.filters = {}; render(); });
  $('#idx-btn').addEventListener('click', function (e) { e.stopPropagation(); var mn = $('#idx-menu'); mn.hidden = !mn.hidden; });
  $$('#idx-menu .menu__item').forEach(function (b) { b.addEventListener('click', function () { state.index = b.dataset.index || null; render(); }); });
  ['#rg-from', '#rg-to'].forEach(function (sel) {
    var inp = $(sel); if (!inp) return;
    inp.addEventListener('change', function () {
      var f = parseIso($('#rg-from').value), t = parseIso($('#rg-to').value), err = null;
      if (!f || !t) err = 'Vyplňte obě data.';
      else {
        if (f < FIRST_BUY) f = FIRST_BUY;
        if (t > TODAY) t = TODAY;
        if (dayDiff(f, t) < 2) err = 'Začátek musí být aspoň dva dny před koncem.';
      }
      if (err) { state.rangeError = err; var box = $('#rg-err'); box.hidden = false; box.innerHTML = icon('circle-alert', 12) + esc(err); $('#rg-hint').hidden = true; return; }
      state.custom = { from: f, to: t }; state.rangeError = null; render();
    });
  });
  $$('.board__row', $('#board')).forEach(function (r) {
    var id = r.dataset.id, t = TAGS[id], drawn = m.rows.concat([m.portfolio, m.index]).some(function (s) { return s && s.id === id && s.drawn; });
    r.addEventListener('mouseenter', function () { if (drawn) setHot(id); });
    r.addEventListener('mouseleave', function () { setHot(null); });
    if (t && !t.group.auto) r.addEventListener('click', function () { state.filters[t.group.id] = id; render(); });
  });
}

/* ===== Assign tags dialog: one tag per group ===== */
var assign = { ids: [], order: [], pick: {}, free: {} };
function openAssign(ids) {
  assign.ids = ids.slice();
  assign.order = POS.filter(function (q) { return ids.indexOf(q.t) >= 0; }).concat(POS.filter(function (q) { return ids.indexOf(q.t) < 0; }));
  resetPicks();
  renderAssign();
  openModal('m-assign');
}
function single() { return assign.ids.length === 1 ? BY_T[assign.ids[0]] : null; }
function resetPicks() {
  var p = single(); assign.pick = {}; assign.free = {};
  GROUPS.forEach(function (g) {
    if (!p) { assign.pick[g.id] = 'keep'; return; }
    var ts = groupTags(p, g);
    assign.pick[g.id] = ts.length === 1 ? ts[0] : (ts.length ? null : 'none');
  });
  FREE.tags.forEach(function (t) { assign.free[t.id] = p ? p.tags.indexOf(t.id) >= 0 : false; });
}
function renderAssign() {
  var p = single(), multi = assign.ids.length > 1;
  var list = assign.order.map(function (q) {
    var on = assign.ids.indexOf(q.t) >= 0, i = POS.indexOf(q);
    return '<label class="as-row"><span class="check"><input type="checkbox" data-pos="' + q.t + '"' + (on ? ' checked' : '') + '></span><i class="logo logo--' + ((i % 4) + 1) + '">' + esc(q.t.slice(0, 2)) + '</i><span><b>' + esc(q.n) + '</b><small>' + esc(q.t) + '</small></span>' +
      '<span class="cur">' + (q.tags.length ? q.tags.map(function (id) { return esc(TAGS[id].name); }).join(' · ') : 'bez štítku') + '</span></label>';
  }).join('');
  var groups = GROUPS.map(function (g) {
    var chosen = assign.pick[g.id], chips = '';
    if (multi || !p) chips += '<button type="button" class="chip chip--quiet' + (chosen === 'keep' ? ' is-active' : '') + '" data-g="' + g.id + '" data-v="keep">Beze změny</button>';
    chips += g.tags.map(function (t) { return '<button type="button" class="chip' + (chosen === t.id ? ' is-active' : '') + '" data-g="' + g.id + '" data-v="' + t.id + '">' + esc(t.name) + '</button>'; }).join('');
    chips += '<button type="button" class="chip chip--quiet' + (chosen === 'none' ? ' is-active' : '') + '" data-g="' + g.id + '" data-v="none">Bez štítku</button>';
    var note = '';
    if (p) { var ts = groupTags(p, g); if (ts.length > 1 && chosen === null) note = '<div class="as-note">' + icon('circle-alert', 12) + 'Teď ' + ts.map(function (id) { return TAGS[id].name; }).join(' a ') + '. Vyberte jeden.</div>'; }
    return '<div class="as-group"><div class="as-group__label"><b>' + esc(g.label) + '</b><small>jeden štítek</small></div><div class="chips">' + chips + '</div>' + note + '</div>';
  }).join('');
  var free = '<div class="as-group"><div class="as-group__label"><b>Bez skupiny</b><small>lze vybrat víc</small></div><div class="chips">' +
    FREE.tags.map(function (t) { return '<button type="button" class="chip' + (assign.free[t.id] ? ' is-active' : '') + '" data-free="' + t.id + '">' + esc(t.name) + '</button>'; }).join('') + '</div></div>';
  $('#as-body').innerHTML = '<div class="field"><div class="field__label"><span>Pozice</span><span class="opt">' + assign.ids.length + ' ' + pl(assign.ids.length, 'vybraná', 'vybrané', 'vybraných') + '</span></div><div class="as-list">' + list + '</div></div>' +
    '<div class="field"><div class="field__label"><span>Štítky</span></div>' + groups + free +
    '<div class="field__hint">Pozice má v každé skupině nejvýš jeden štítek. Vybraný štítek nahradí ten dosavadní' + (multi ? ', skupiny na Beze změny zůstanou, jak jsou. Štítky bez skupiny se přidají.' : '.') + '</div></div>';
  $('#as-save').disabled = !assign.ids.length;
  $$('#as-body [data-pos]').forEach(function (c) {
    c.addEventListener('change', function () {
      var t = c.dataset.pos, i = assign.ids.indexOf(t);
      if (c.checked && i < 0) assign.ids.push(t); else if (!c.checked && i >= 0) assign.ids.splice(i, 1);
      resetPicks(); renderAssign();
    });
  });
  $$('#as-body [data-g]').forEach(function (b) { b.addEventListener('click', function () { assign.pick[b.dataset.g] = b.dataset.v; renderAssign(); }); });
  $$('#as-body [data-free]').forEach(function (b) { b.addEventListener('click', function () { assign.free[b.dataset.free] = !assign.free[b.dataset.free]; renderAssign(); }); });
}
function saveAssign() {
  var multi = assign.ids.length > 1;
  assign.ids.forEach(function (t) {
    var p = BY_T[t];
    GROUPS.forEach(function (g) {
      var v = assign.pick[g.id];
      if (v === 'keep' || v === null || v === undefined) return;
      p.tags = p.tags.filter(function (id) { return TAGS[id].group !== g; });
      if (v !== 'none') p.tags.push(v);
    });
    FREE.tags.forEach(function (ft) {
      var has = p.tags.indexOf(ft.id) >= 0;
      if (assign.free[ft.id] && !has) p.tags.push(ft.id);
      if (!multi && !assign.free[ft.id] && has) p.tags = p.tags.filter(function (id) { return id !== ft.id; });
    });
  });
  closeModal('m-assign');
  toast('Štítky přiřazeny');
  render();
}

renderShell({ active: 'stocksAnalysis' });
render();
var resizeTimer;
window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); });
document.addEventListener('click', function (e) {
  var mn = $('#idx-menu'); if (mn && !mn.hidden && !e.target.closest('.menu-host')) mn.hidden = true;
  var a = e.target.closest('[data-assign]');
  if (a && a.closest('#page')) { var v = a.dataset.assign; openAssign(v ? v.split(',') : []); }
});
$$('#m-assign [data-close]').forEach(function (b) { b.addEventListener('click', function () { closeModal('m-assign'); }); });
$('#m-assign .modal__close').innerHTML = icon('x', 14);
$('#as-save').addEventListener('click', saveAssign);
$('#ring-seg').addEventListener('segchange', function (e) { state.ring = e.detail === 'on'; render(); });
$('#notes-toggle').addEventListener('change', function (e) { document.body.classList.toggle('notes-on', e.target.checked); });
})();
</script>
</body>
</html>
