<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moony — tmavý režim (návrh)</title>
<link rel="stylesheet" href="../design-system/moony.css">
<style id="light-extras">
  /* Tokens that src/index.css already has and tokens.css does not yet (the implementation
     moves them into tokens.css so the two files are identical again). Light values. */
  :root {
    --hero-orb: #f0eee8;
    --line-hover: #c9c5bc;
    --ink-hover: rgba(41, 40, 34, 0.05);
    --loss-line: #f1cfc3;
    --loss-hover: #a8391d;
    --loss-ring: 0 0 0 3px rgba(191, 66, 36, 0.14);
    --sh-btn-hover: 0 1px 3px rgba(52, 46, 34, 0.1);
    --sh-seg: 0 1px 3px rgba(34, 34, 34, 0.13);
    --sh-destructive: inset 0 1px rgba(255, 255, 255, 0.12), 0 3px 7px rgba(191, 66, 36, 0.2);
  }
</style>
<style id="dark-tokens">
  /* ===== Dark theme: the shared token set (same names as tokens.css, no new names). =====
     Warm near-black, never #000. Depth comes from surface steps (canvas < sidebar < paper);
     wells go deeper = darker in both themes. The contrast material (`dark`) inverts: it is the
     light material in the dark theme, so active nav, primary button, tooltip, checked controls
     keep `background: var(--dark); color: var(--ink-inverse)` unchanged. */
  :root[data-theme="dark"] {
    color-scheme: dark;

    /* ---- Surfaces ---- */
    --canvas: #1a1917;
    --canvas-glow: #22211e;
    --sidebar: #1f1e1b;
    --sidebar-2: #1c1b19;
    --paper: #292826;
    --paper-2: #2b2a27;
    --well: #232220;
    --well-2: #1e1d1b;
    --well-3: #181715;
    --hero-orb: #302f2b;

    /* ---- Lines ---- */
    --line: #363531;
    --line-soft: #302f2c;
    --line-strong: #45443f;
    --line-sidebar: #2b2a27;
    --line-hover: #56544e;

    /* ---- Ink ---- */
    --ink: #eceae4;
    --ink-2: #cdcbc4;
    --ink-3: #a3a098;
    --ink-4: #868379;
    --ink-5: #6b6962;
    --ink-inverse: #1d1c19;
    --ink-inverse-2: #5f5c54;
    --ink-hover: rgba(0, 0, 0, 0.18);

    /* ---- Contrast material (light on dark) ---- */
    --dark: #e9e7e1;
    --dark-hi: #f3f1ec;
    --dark-lo: #e2e0d9;
    --dark-hover-hi: #faf9f5;
    --dark-hover-lo: #ebe9e3;

    /* ---- Semantic ---- */
    --gain: #45c6a6;
    --gain-soft: #203c30;
    --loss: #ef7f5e;
    --loss-soft: #4a2d25;
    --loss-line: #6e3e32;
    --loss-hover: #ff9e84;
    --loss-ring: 0 0 0 3px rgba(239, 127, 94, 0.22);

    /* ---- Data series (same indigo family, re-stepped for dark paper) ---- */
    --s1: #d8dbf0;
    --s2: #a2a7ec;
    --s3: #7b7ea5;
    --s4: #4f508e;
    --s-other: #3a3935;
    --chart-line: #b5b9eb;
    --chart-area: #393b52;
    --chart-grid: #302f2c;
    --chart-cost: #78756d;
    --chart-axis: #6b6962;

    /* ---- Focus ---- */
    --focus-border: #a09d94;
    --focus-ring: 0 0 0 3px rgba(255, 255, 255, 0.12);

    /* ---- Elevation (black-based, stronger; the 1 px line and the surface step carry the card) ---- */
    --sh-sidebar: 7px 0 22px rgba(0, 0, 0, 0.22);
    --sh-1: 0 2px 5px rgba(0, 0, 0, 0.24), 0 9px 22px rgba(0, 0, 0, 0.14);
    --sh-2: 0 4px 10px rgba(0, 0, 0, 0.26), 0 16px 35px rgba(0, 0, 0, 0.18);
    --sh-3: 0 4px 11px rgba(0, 0, 0, 0.28), 0 20px 38px rgba(0, 0, 0, 0.2);
    --sh-pop: 0 8px 24px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
    --sh-modal: 0 26px 80px rgba(0, 0, 0, 0.7);
    --sh-dark: inset 0 1px rgba(255, 255, 255, 0.55), 0 3px 7px rgba(0, 0, 0, 0.35);
    --sh-btn: 0 1px 2px rgba(0, 0, 0, 0.3);
    --sh-btn-hover: 0 1px 3px rgba(0, 0, 0, 0.4);
    --sh-seg: 0 1px 3px rgba(0, 0, 0, 0.45);
    --sh-destructive: inset 0 1px rgba(255, 255, 255, 0.12), 0 3px 7px rgba(0, 0, 0, 0.35);
    --scrim: rgba(12, 11, 9, 0.7);
  }
</style>
<style id="component-fixes">
  /* ===== moony.css changes the implementation makes: raw literals become tokens. ===== */
  .hero::after { background: var(--hero-orb); }
  .nav__item:hover, .account:hover, .btn--ghost:hover { background: var(--ink-hover); }
  .input:hover, .select:hover, .textarea:hover { border-color: var(--line-hover); }
  .input.is-invalid:focus { box-shadow: var(--loss-ring); }
  .btn:hover { box-shadow: var(--sh-btn-hover); }
  .seg__btn.is-active { box-shadow: var(--sh-seg); }
  .check input:checked::after { border-color: var(--ink-inverse); }
  .switch input::after { background: var(--paper); }
  .switch input:checked::after { background: var(--ink-inverse); }
  .avatar { box-shadow: inset 0 1px rgba(255, 255, 255, 0.13); }
  .logo { color: var(--ink-inverse); }
  .logo--4 { color: var(--ink); }
  .badge--dark, .chip.is-active { color: var(--ink-inverse); }
  .tip, .tip b { color: var(--ink-inverse); }
  .btn--destructive { color: var(--ink-inverse); box-shadow: var(--sh-destructive); }
  .btn--destructive:hover { background: var(--loss-hover); color: var(--ink-inverse); }
  .alert--error { border-color: var(--loss-line); }
  /* charts.js: the white end ring, event marks and area fade end become paper tokens */
  .chart svg [fill="#fff"] { fill: var(--paper); }
  .chart svg [stroke="#fff"] { stroke: var(--paper); }
  .chart svg stop[stop-color="#fbfaf8"] { stop-color: var(--paper-2); }
  /* The one component rule that is theme-specific: the off-state switch thumb must stay light
     on the dark track (paper would sink into it). Everything else is tokens only. */
  :root[data-theme="dark"] .switch input:not(:checked)::after { background: var(--ink-2); }

  /* Category icon chip (CategoryIconChip): the user's hue, 15 % tint over paper; in the dark
     theme the glyph is lifted 30 % towards ink in OKLab so every preset clears 4.9:1. */
  .cat { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; color: var(--cat); background: color-mix(in srgb, var(--cat) 15%, transparent); }
  .cat .ic { width: 15px; height: 15px; }
  :root[data-theme="dark"] .cat { color: color-mix(in oklab, var(--cat) 70%, var(--ink)); }
</style>
<style id="prototype-only">
  /* Prototype-only styles. Everything else comes from the design system. */
  html { overflow-y: scroll; }
  .sidebar { top: 42px; height: calc(100vh - 42px); }

  /* Prototype bar: fixed colors on purpose (prototype chrome, not part of either theme) */
  .proto-bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 20px; background: linear-gradient(145deg, #3b3932, #27251f); box-shadow: inset 0 1px rgba(255,255,255,.13), 0 3px 7px rgba(0,0,0,.25); color: #d6d3cc; font-size: 11px; font-weight: 600; }
  .proto-bar__tag { padding: 3px 7px; border-radius: 5px; background: rgba(255,255,255,.14); color: #fff; font-size: 9px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  .proto-bar__title { color: #fff; font-weight: 650; letter-spacing: -.01em; }
  .proto-bar__spacer { flex: 1; }
  .proto-bar .seg { background: rgba(255,255,255,.11); }
  .proto-bar .seg__btn { color: #d6d3cc; transition: none; box-shadow: none; }
  .proto-bar .seg__btn:hover { color: #fff; }
  .proto-bar .seg__btn.is-active { background: #f4f2ec; color: #292822; box-shadow: none; }
  .proto-bar__toggle { display: inline-flex; align-items: center; gap: 10px; color: #fff; cursor: pointer; }
  .proto-bar .switch input { background: rgba(255,255,255,.22); }
  .proto-bar .switch input::after { background: #fff; }
  .proto-bar .switch input:checked { background: #f4f2ec; }
  .proto-bar .switch input:checked::after { background: #2c2a25; }
  .proto-bar__kbd { padding: 1px 5px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; color: #fff; font-size: 9px; font-weight: 700; }

  /* Design-note callouts (fixed colors: prototype chrome) */
  .has-np { position: relative; }
  .np { position: absolute; z-index: 4; display: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #2c2a25; box-shadow: 0 0 0 2px var(--canvas); color: #fff; font-size: 10px; font-weight: 700; font-style: normal; line-height: 20px; text-align: center; pointer-events: none; }
  .notes-on .np { display: block; }
  .np--tl { left: -10px; top: -10px; }
  .np--tr { right: -10px; top: -10px; }
  .np--inline { position: static; margin-left: auto; }
  .notes-on .np--inline { display: inline-block; }
  .notes-card { display: none; }
  .notes-on .notes-card { display: block; }
  .notes { display: grid; grid-template-columns: 1fr 1fr; column-gap: 44px; margin: 0; padding: 0 21px 10px; list-style: none; }
  .notes li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 13px 0; border-top: 1px solid var(--line-soft); color: var(--ink-2); font-size: var(--fs-table); line-height: 1.55; }
  .notes li:nth-child(-n+2) { border-top: 0; }
  .notes .np { position: static; display: inline-block; margin-top: 1px; box-shadow: none; }
  .notes b { display: block; color: var(--ink); font-weight: 650; }
  .notes .badge { margin-top: 6px; }
  .notes code { padding: 1px 4px; border-radius: 4px; background: var(--well-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--ink); }
  .card--flat .card__head { padding-bottom: 16px; }

  /* Page layout */
  .stack { display: flex; flex-direction: column; gap: 17px; }
  .stack .stats { margin-bottom: 0; }
  .two-col--dash { grid-template-columns: 1.15fr .85fr; }
  .hero--compact::after { display: none; }
  .hero--compact { padding-top: 20px; }
  .hero--compact .hero__value { margin: 6px 0; font-size: 22px; letter-spacing: -0.05em; }
  .hero__aside .hero__label { max-width: 220px; text-align: right; }
  .axis--slots span { flex: 1; text-align: center; }
  .chart svg path { pointer-events: none; }
  .chart .bar { cursor: pointer; transition: opacity var(--t-base); }
  .chart .bar.is-muted { opacity: .35; }
  .pnav { display: inline-flex; align-items: center; gap: 4px; }
  .flip { transform: scaleX(-1); }
  .card__head .legend { margin: 0; }

  /* Agenda ("Co vás čeká") */
  .agenda__grid { display: grid; grid-template-columns: 1fr 1fr; padding: 8px 6px; }
  .ag { display: flex; align-items: center; gap: 14px; padding: 9px 15px; border-radius: var(--r-2); }
  .ag:hover { background: var(--well); }
  .ag > div { min-width: 0; flex: 1; }
  .ag b { display: block; font-size: var(--fs-table); font-weight: 650; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag small { display: block; margin-top: 3px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .dchip { display: grid; place-content: center; flex: none; width: 60px; height: 42px; border-radius: 8px; background: var(--well); text-align: center; }
  .dchip b { display: block; font-size: var(--fs-table); font-weight: 650; color: var(--ink); line-height: 1.2; }
  .dchip small { display: block; margin-top: 1px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
  .dchip--soon { background: var(--dark-grad); box-shadow: var(--sh-dark); }
  .dchip--soon b { color: var(--ink-inverse); }
  .dchip--soon small { color: var(--ink-inverse-2); }
  .agenda__upkeep { display: flex; align-items: center; gap: 10px; padding: 11px 21px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: var(--fs-table); }
  .agenda__upkeep b { color: var(--ink); font-weight: 650; }
  .agenda__upkeep .link { margin-left: auto; }

  /* Allocation card */
  .alloc { display: grid; grid-template-columns: 184px 1fr; gap: 36px; align-items: center; }
  .alloc .ring { width: 184px; height: 184px; }
  .alloc .ring::after { inset: 28px; }
  .alloc ul { margin: 0; padding: 0; list-style: none; }
  .alloc li { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: var(--fs-table); color: var(--ink); font-weight: 600; }
  .alloc li:last-child { border-bottom: 0; }
  .alloc li .amt { color: var(--ink-3); font-weight: 500; font-variant-numeric: tabular-nums; }
  .alloc li .pct { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

  /* Tables */
  .mov-grid { grid-template-columns: minmax(0,1fr) 110px 120px; column-gap: 16px; }
  .led-grid { grid-template-columns: 62px minmax(0,1fr) 210px 150px; column-gap: 16px; }
  .cat-grid { grid-template-columns: minmax(0,1fr) 120px 56px 120px; column-gap: 16px; }
  .cat-name { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: var(--fw-table-name); }
  .cat-name small { color: var(--ink-4); font-weight: 500; }
  .share { width: 100px; }
  .ledger-head { flex-wrap: wrap; }
  .ledger-head .toolbar { flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .ledger-sub { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 0 21px 15px; }
  .select-wrap--sm { width: 176px; }
  .select-wrap--sm .select { height: 35px; font-size: var(--fs-table); }
  .select-wrap--period { width: 190px; }
  .entity > div { min-width: 0; }
  .entity b, .entity small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .cat { width: 18px; height: 18px; margin-left: -4px; }
  .chip .cat .ic { width: 11px; height: 11px; }
  .pager { display: inline-flex; gap: 4px; }
  .period-nav { display: inline-flex; align-items: center; gap: 2px; }
  .period-nav b { min-width: 64px; text-align: center; font-size: var(--fs-h3); font-weight: var(--fw-h3); letter-spacing: var(--ls-h3); }

  /* Components screen */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .panels .card--wide { grid-column: 1 / -1; }
  .panel__body { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 0 21px 20px; }
  .panel__body--col { flex-direction: column; align-items: stretch; gap: 14px; }
  .panel__body .menu, .panel__body .tip, .panel__body .toast { position: static; transform: none; opacity: 1; }
  .panel__body .menu { width: 210px; }
  .panel__body .tip { display: inline-block; }
  .demo-focus { border-color: var(--focus-border) !important; box-shadow: var(--focus-ring) !important; }
  .sk { display: grid; gap: 10px; width: 100%; }
  .sk .skeleton { height: 12px; }
  .srow { display: flex; align-items: center; gap: 12px; width: 100%; }
  .srow .skeleton--disc { width: 30px; height: 30px; border-radius: 50%; }
  .ring--sm { width: 130px; height: 130px; }
  .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 24px; width: 100%; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .settings-row:last-child { border-bottom: 0; }
  .settings-row b { display: block; font-size: var(--fs-body); font-weight: 600; color: var(--ink); }
  .settings-row small { display: block; margin-top: 2px; color: var(--ink-4); font-size: var(--fs-caption); }
  .settings-row .seg { flex: none; }
  .tok { width: 100%; border-top: 1px solid var(--line); }
  .tok__head, .tok__row { display: grid; grid-template-columns: 190px 1fr 1fr 1.2fr; gap: 14px; align-items: center; padding: 0 21px; }
  .tok__head { height: 36px; background: var(--well); border-bottom: 1px solid var(--line); color: var(--ink-3); font-size: var(--fs-thead); font-weight: var(--fw-thead); letter-spacing: var(--ls-thead); text-transform: uppercase; }
  .tok__row { min-height: 34px; border-bottom: 1px solid var(--line-soft); font-size: var(--fs-caption); color: var(--ink-2); }
  .tok__row code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--ink); }
  .tok__group { padding: 10px 21px 4px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line-soft); }
  .sw { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .sw i { display: inline-block; flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line); }
  .sw i.sw--light { background: var(--paper); }
  .sw span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tok__note { color: var(--ink-3); }
  .mini-scrim { position: relative; width: 100%; height: 150px; overflow: hidden; border-radius: 10px; background: var(--canvas); }
  .mini-scrim::before { content: ""; position: absolute; inset: 0; background: var(--scrim); }
  .mini-scrim .modal { position: absolute; left: 50%; top: 24px; width: 300px; transform: translateX(-50%); }
  .mini-scrim .modal__head { padding: 14px 16px 10px; }
  .mini-scrim .modal__head h2 { font-size: 14px; }
  .mini-scrim .modal__foot { padding: 10px 16px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="proto-bar__tag">Návrh</span>
  <span class="proto-bar__title">Tmavý režim</span>
  <div class="seg" id="theme-seg">
    <button type="button" class="seg__btn" data-value="light">Světlý</button>
    <button type="button" class="seg__btn" data-value="dark">Tmavý</button>
  </div>
  <div class="seg" id="screen-seg">
    <button type="button" class="seg__btn" data-value="overview">Přehled</button>
    <button type="button" class="seg__btn" data-value="account">Detail účtu</button>
    <button type="button" class="seg__btn" data-value="cashflow">Cashflow</button>
    <button type="button" class="seg__btn" data-value="components">Komponenty</button>
  </div>
  <span><span class="proto-bar__kbd">D</span> přepne téma</span>
  <span class="proto-bar__spacer"></span>
  <label class="proto-bar__toggle"><span>Poznámky k návrhu</span><span class="switch"><input type="checkbox" id="notes-toggle"></span></label>
</div>

<div class="app">
  <aside class="sidebar"></aside>
  <main class="page" id="page"></main>
</div>

<div class="modal-scrim" id="m-demo">
  <form class="modal" onsubmit="return false" aria-labelledby="demo-title">
    <div class="modal__head">
      <div><h2 id="demo-title">Přidat bankovní účet</h2><p>Zůstatek se uloží jako první záznam v historii účtu.</p></div>
      <button type="button" class="modal__close" aria-label="Zavřít" data-close="m-demo"></button>
    </div>
    <div class="modal__body">
      <div class="field"><label class="field__label" for="d-name">Název účtu</label><input class="input" id="d-name" value="Spořicí účet" autocomplete="off"></div>
      <div class="row-2">
        <div class="field"><label class="field__label" for="d-inst">Instituce <span class="opt">nepovinné</span></label><div class="select-wrap"><select class="select" id="d-inst"><option>Česká spořitelna</option><option>Fio banka</option><option>Air Bank</option></select><i class="sel-ic"></i></div></div>
        <div class="field"><label class="field__label" for="d-cur">Měna</label><div class="select-wrap"><select class="select" id="d-cur"><option>CZK</option><option>EUR</option></select><i class="sel-ic"></i></div></div>
      </div>
      <div class="row-2 row-2--narrow">
        <div class="field"><label class="field__label" for="d-bal">Aktuální zůstatek</label><div class="input-wrap"><input class="input" id="d-bal" value="184 600" style="padding-left:11px"><span class="unit">Kč</span></div><div class="field__hint">Zůstatek z výpisu nebo z bankovnictví.</div></div>
        <div class="field"><label class="field__label" for="d-date">K datu</label><input class="input" type="date" id="d-date" value="2026-10-16"></div>
      </div>
    </div>
    <div class="modal__foot">
      <button type="button" class="btn btn--ghost" data-close="m-demo">Zrušit</button>
      <div class="actions"><button type="button" class="btn btn--danger">Smazat návrh</button><button type="button" class="btn btn--primary" data-close="m-demo" data-toast="Účet přidán">Přidat účet</button></div>
    </div>
  </form>
</div>

<script src="../design-system/icons.js"></script>
<script src="../design-system/shell.js"></script>
<script src="../design-system/charts.js"></script>
<script>
(function () {
'use strict';

/* ===== Helpers ===== */
var TODAY = new Date(2026, 9, 16);
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function D(y, m, d) { return new Date(y, m - 1, d); }
function pill(n, cls) { return '<i class="np ' + (cls || 'np--tl') + '">' + n + '</i>'; }
function signCls(v) { return v > 0 ? 'gain' : (v < 0 ? 'loss' : ''); }
function stat(label, value, note, cls, dot) {
  return '<div class="stat"><div class="stat__label"><span>' + label + '</span>' + (dot ? '<i class="dot" style="background:var(--' + dot + ')"></i>' : '') + '</div><span class="stat__value num ' + (cls || '') + '">' + value + '</span><span class="stat__note">' + note + '</span></div>';
}
function legendItem(sw, label) { return '<span class="legend__item">' + sw + label + '</span>'; }

    $$('.bar', el).forEach(function (r) { if (+r.getAttribute('data-i') !== S.fm) r.classList.add('is-muted'); });
  }
  if ((el = $('#cf-chart'))) drawBars(el, CF_MONTHS.map(function (m) { return { label: CZ_MONTHS[m.m - 1] + ' 26', a: m.a, b: m.b }; }), { axisEl: $('#cf-axis'), height: 200, names: ['Příjmy', 'Výdaje'] });
  if ((el = $('#c-chart'))) {
    var cpts = [], cost = []; for (var i = 0; i <= 24; i++) { var d = new Date(2024, 9 + i, 1); cpts.push({ date: d, value: 180000 + i * 9000 + Math.round(Math.sin(i / 2.2) * 22000) }); if (i % 6 === 0) cost.push({ date: d, value: 160000 + i * 7000 }); }
    drawLine(el, cpts, { axisEl: $('#c-axis'), height: 150, cost: cost, events: [{ date: new Date(2025, 3, 1), type: 'buy', html: '<b>Nákup 20 ks</b><small>1. 4. 2025</small>' }, { date: new Date(2026, 1, 1), type: 'sell', html: '<b>Prodej 5 ks</b><small>1. 2. 2026</small>' }, { date: new Date(2025, 8, 1), type: 'div', html: '<b>Dividenda 4 120 Kč</b><small>1. 9. 2025</small>' }], labels: ['říj 24', 'dub 25', 'říj 25', 'dub 26', 'Dnes'] });
  }
}

/* ===== Render ===== */
function render() {
  var html = S.screen === 'overview' ? overviewHTML() : S.screen === 'account' ? accountHTML() : S.screen === 'cashflow' ? cashflowHTML() : componentsHTML();
  $('#page').innerHTML = html;
  renderShell({ active: SCREEN_NAV[S.screen] });
  var act = $('.nav__item.is-active'); if (act) { act.classList.add('has-np'); act.insertAdjacentHTML('afterbegin', pill(2)); }
  $$('#screen-seg .seg__btn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-value') === S.screen); });
  $$('.select-wrap .sel-ic').forEach(function (i) { i.outerHTML = icon('chevron-down', 14); });
  tokenTable();
  drawCharts();
  window.scrollTo(0, 0);
}
function applyTheme(t) {
  S.theme = t; document.documentElement.setAttribute('data-theme', t);
  $$('#theme-seg .seg__btn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-value') === t); });
  $$('#c-theme .seg__btn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-value') === t); });
  syncUrl();
}
function syncUrl() {
  var q = new URLSearchParams(); q.set('theme', S.theme); q.set('screen', S.screen); if (S.notes) q.set('notes', '1');
  history.replaceState(null, '', '?' + q.toString());
}

/* ===== Events ===== */
$('#theme-seg').addEventListener('segchange', function (e) { applyTheme(e.detail); });
$('#screen-seg').addEventListener('segchange', function (e) { S.screen = e.detail; syncUrl(); render(); });
document.addEventListener('segchange', function (e) {
  if (e.target.id === 'c-theme') { var v = e.detail; applyTheme(v === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : v); $$('#c-theme .seg__btn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-value') === v); }); }
});
document.addEventListener('keydown', function (e) { if ((e.key === 'd' || e.key === 'D') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) applyTheme(S.theme === 'dark' ? 'light' : 'dark'); });
document.addEventListener('click', function (e) {
  var c = e.target.closest('[data-close]'); if (c) { closeModal(c.getAttribute('data-close')); if (c.getAttribute('data-toast')) toast(c.getAttribute('data-toast')); return; }
  if (e.target.closest('#open-demo')) { openModal('m-demo'); return; }
  var r = e.target.closest('.table__row.is-clickable'); if (r) toast('Otevře transakce kategorie');
});
$('#notes-toggle').addEventListener('change', function (e) { S.notes = e.target.checked; document.body.classList.toggle('notes-on', S.notes); syncUrl(); });
var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(drawCharts, 120); });

/* ===== Init ===== */
(function init() {
  captureLight();
  var q = new URLSearchParams(location.search);
  S.screen = SCREEN_NAV[q.get('screen')] ? q.get('screen') : 'overview';
  if (q.get('notes') === '1') { S.notes = true; $('#notes-toggle').checked = true; document.body.classList.add('notes-on'); }
  $$('.modal__close').forEach(function (b) { b.innerHTML = icon('x', 15); });
  applyTheme(q.get('theme') === 'dark' ? 'dark' : 'light');
  render();
})();
})();
</script>
</body>
</html>
