<!doctype html>

<title>Moony · Výdajové plány</title>
<!-- Static Czech design prototype of "Výdajové plány" (spending plans). Fictional CZK data, no API calls,
     no persistence: edits live in memory until reload. Design contract: docs/design-system/{tokens,moony}.css,
     inlined below. Font: Inter (embedded). Icons: Lucide (ISC). Production needs all ten locales. -->
<style>/* Moony design tokens — single source of truth.
   Two themes: the `:root` block is light, `:root[data-theme="dark"]` is dark (same names,
   README.md §2 and §11). `src/index.css` carries the same declarations; `src/index.test.ts`
   guards it. Every value here has a name; components never use raw hex. */
:root {
  /* ---- Surfaces (from outer canvas to the elevated workspace) ---- */
  --canvas: #eeece7;        /* outer canvas, one tone darker than content */
  --canvas-glow: #fbfaf7;   /* radial highlight top-right of the canvas */
  --sidebar: #f8f7f3;       /* sidebar layer */
  --sidebar-2: #f5f4f0;     /* sidebar gradient end */
  --paper: #ffffff;         /* working surfaces: cards, tables, modals */
  --paper-2: #fdfcf9;       /* card gradient end (barely warmer than paper) */
  --well: #f7f6f2;          /* inset areas: table header, modal footer, hover rows */
  --well-2: #e9e7e1;        /* segmented-control track, chips, avatar */
  --well-3: #e3e0d9;        /* stronger inset: progress track, skeleton */
  --hero-orb: #f0eee8;      /* decorative circle in the hero card */

  /* ---- Lines ---- */
  --line: #e2dfd7;          /* card and table borders */
  --line-soft: #efede8;     /* row dividers, chart grid */
  --line-strong: #d9d5cd;   /* secondary button border, input border */
  --line-sidebar: #e1ded6;
  --line-hover: #c9c5bc;    /* input hover border */

  /* ---- Ink (text), from primary to faintest ---- */
  --ink: #292822;           /* headings, primary values, names */
  --ink-2: #504d46;         /* body copy, table values */
  --ink-3: #817e75;         /* secondary text, descriptions */
  --ink-4: #98948b;         /* labels, captions, eyebrows */
  --ink-5: #aaa7a0;         /* axis ticks, placeholders */
  --ink-inverse: #ffffff;
  --ink-inverse-2: #d6d3cc; /* secondary text on dark material */
  --ink-hover: rgba(41, 40, 34, 0.05); /* 5 % ink: nav and ghost hover */

  /* ---- Dark material (active nav, primary button) ---- */
  --dark: #2c2a25;
  --dark-hi: #3b3932;       /* gradient start (light edge) */
  --dark-lo: #27251f;       /* gradient end */
  --dark-hover-hi: #46433b;
  --dark-hover-lo: #2f2d27;
  --dark-grad: linear-gradient(145deg, var(--dark-hi), var(--dark-lo));
  --dark-grad-hover: linear-gradient(145deg, var(--dark-hover-hi), var(--dark-hover-lo));

  /* ---- Semantic: the only two chromatic colors in the UI ---- */
  --gain: #107a60;          /* positive change ONLY (never decoration) */
  --gain-soft: #e6f5ee;     /* tint for gain badges */
  --loss: #bf4224;          /* negative change, destructive, validation errors */
  --loss-soft: #fcece6;
  --loss-line: #f1cfc3;     /* error alert border, danger-zone card */
  --loss-hover: #a8391d;    /* destructive button hover */
  --loss-ring: 0 0 0 3px rgba(191, 66, 36, 0.14); /* invalid field focus ring */

  /* ---- Data series (one muted indigo family, max 4 + other; validated ΔE ≥ 15 between neighbours) ---- */
  --s1: #212339;
  --s2: #454a73;
  --s3: #7176a0;
  --s4: #a6a9c8;
  --s-other: #ebe9e3;       /* "Ostatní" bucket, always labeled */
  --chart-line: #3c3f67;    /* primary value line */
  --chart-area: #e1e1ee;    /* area fill start (fades to transparent) */
  --chart-grid: #efeeea;
  --chart-cost: #a8a49b;    /* dashed "invested" step line */
  --chart-axis: #aaa7a0;

  /* ---- Focus ---- */
  --focus-border: #57544d;
  --focus-ring: 0 0 0 3px rgba(39, 38, 32, 0.10);

  /* ---- Radius ---- */
  --r-1: 6px;   /* inputs, segmented buttons, small chips */
  --r-2: 8px;   /* buttons, nav rows, menu, badges */
  --r-3: 13px;  /* stat cards */
  --r-4: 15px;  /* cards, tables */
  --r-5: 17px;  /* modal */

  /* ---- Elevation ---- */
  --sh-sidebar: 7px 0 22px rgba(58, 53, 36, 0.03);
  --sh-1: 0 2px 5px rgba(64, 58, 43, 0.05), 0 9px 22px rgba(64, 58, 43, 0.02);     /* stat card */
  --sh-2: 0 4px 10px rgba(68, 60, 43, 0.05), 0 16px 35px rgba(68, 60, 43, 0.03);   /* card */
  --sh-3: 0 4px 11px rgba(68, 60, 43, 0.055), 0 20px 38px rgba(68, 60, 43, 0.035); /* table (workspace) */
  --sh-pop: 0 8px 24px rgba(18, 17, 13, 0.12), 0 1px 2px rgba(18, 17, 13, 0.06);  /* menu, tooltip */
  --sh-modal: 0 26px 80px rgba(18, 17, 13, 0.44);
  --sh-dark: inset 0 1px rgba(255, 255, 255, 0.13), 0 3px 7px rgba(39, 35, 28, 0.15); /* dark material */
  --sh-btn: 0 1px 2px rgba(52, 46, 34, 0.06);                                       /* secondary button */
  --sh-btn-hover: 0 1px 3px rgba(52, 46, 34, 0.1);                                  /* secondary button hover */
  --sh-seg: 0 1px 3px rgba(34, 34, 34, 0.13);                                       /* active segmented pill */
  --sh-destructive: inset 0 1px rgba(255, 255, 255, 0.12), 0 3px 7px rgba(191, 66, 36, 0.2); /* destructive button */
  --scrim: rgba(30, 29, 25, 0.63);

  /* ---- Typography ---- */
  --font: "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-display: 42px;  --fw-display: 580; --ls-display: -0.08em;  /* hero number */
  --fs-h1: 36px;       --fw-h1: 570;      --ls-h1: -0.07em;       /* page title */
  --fs-h2: 18px;       --fw-h2: 650;      --ls-h2: -0.045em;      /* card / table title */
  --fs-h3: 16px;       --fw-h3: 620;      --ls-h3: -0.04em;       /* section inside a card */
  --fs-stat: 22px;     --fw-stat: 580;    --ls-stat: -0.06em;     /* stat value */
  --fs-modal: 21px;    --fw-modal: 600;   --ls-modal: -0.05em;    /* modal title */
  --fs-body: 13px;     --fw-body: 450;
  --fs-nav: 14px;      --fw-nav: 600;     --ls-nav: -0.015em;
  --fs-table: 12px;    --fw-table: 480;   --fw-table-name: 650;
  --fs-caption: 11px;  --fw-caption: 500;
  --fs-micro: 10px;    --fw-micro: 600;
  --fs-eyebrow: 10px;  --fw-eyebrow: 700; --ls-eyebrow: 0.12em;
  --fs-thead: 10px;    --fw-thead: 750;   --ls-thead: 0.08em;

  /* ---- Spacing (4px base) ---- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 48px;

  /* ---- Layout ---- */
  --sidebar-w: 264px;
  --page-max: 1480px;
  --page-pad-x: 48px;
  --page-pad-t: 32px;
  --control-h: 36px;
  --control-h-sm: 32px;
  --input-h: 39px;
  --nav-row-h: 36px;
  --table-row-h: 56px;

  /* ---- Motion ---- */
  --t-fast: 120ms;
  --t-base: 180ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

/* ===== Dark theme: the shared token set (same names as tokens.css, no new names). =====
   Warm near-black, never #000. Depth comes from surface steps (canvas < sidebar < paper);
   wells go deeper = darker in both themes. The contrast material (`dark`) inverts: it is the
   light material in the dark theme, so active nav, primary button, tooltip, checked controls
   keep `background: var(--dark); color: var(--ink-inverse)` unchanged. */
:root[data-theme="dark"] {
  color-scheme: dark;

  /* ---- Surfaces ---- */
  --canvas: #1a1917;
  --canvas-glow: #22211e;
  --sidebar: #1f1e1b;
  --sidebar-2: #1c1b19;
  --paper: #292826;
  --paper-2: #2b2a27;
  --well: #232220;
  --well-2: #1e1d1b;
  --well-3: #181715;
  --hero-orb: #302f2b;

  /* ---- Lines ---- */
  --line: #363531;
  --line-soft: #302f2c;
  --line-strong: #45443f;
  --line-sidebar: #2b2a27;
  --line-hover: #56544e;

  /* ---- Ink ---- */
  --ink: #eceae4;
  --ink-2: #cdcbc4;
  --ink-3: #a3a098;
  --ink-4: #868379;
  --ink-5: #6b6962;
  --ink-inverse: #1d1c19;
  --ink-inverse-2: #5f5c54;
  --ink-hover: rgba(0, 0, 0, 0.18);

  /* ---- Contrast material (light on dark) ---- */
  --dark: #e9e7e1;
  --dark-hi: #f3f1ec;
  --dark-lo: #e2e0d9;
  --dark-hover-hi: #faf9f5;
  --dark-hover-lo: #ebe9e3;

  /* ---- Semantic ---- */
  --gain: #45c6a6;
  --gain-soft: #203c30;
  --loss: #ef7f5e;
  --loss-soft: #4a2d25;
  --loss-line: #6e3e32;
  --loss-hover: #ff9e84;
  --loss-ring: 0 0 0 3px rgba(239, 127, 94, 0.22);

  /* ---- Data series (same indigo family, re-stepped for dark paper) ---- */
  --s1: #d8dbf0;
  --s2: #a2a7ec;
  --s3: #7b7ea5;
  --s4: #4f508e;
  --s-other: #3a3935;
  --chart-line: #b5b9eb;
  --chart-area: #393b52;
  --chart-grid: #302f2c;
  --chart-cost: #78756d;
  --chart-axis: #6b6962;

  /* ---- Focus ---- */
  --focus-border: #a09d94;
  --focus-ring: 0 0 0 3px rgba(255, 255, 255, 0.12);

  /* ---- Elevation (black-based, stronger; the 1 px line and the surface step carry the card) ---- */
  --sh-sidebar: 7px 0 22px rgba(0, 0, 0, 0.22);
  --sh-1: 0 2px 5px rgba(0, 0, 0, 0.24), 0 9px 22px rgba(0, 0, 0, 0.14);
  --sh-2: 0 4px 10px rgba(0, 0, 0, 0.26), 0 16px 35px rgba(0, 0, 0, 0.18);
  --sh-3: 0 4px 11px rgba(0, 0, 0, 0.28), 0 20px 38px rgba(0, 0, 0, 0.2);
  --sh-pop: 0 8px 24px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
  --sh-modal: 0 26px 80px rgba(0, 0, 0, 0.7);
  --sh-dark: inset 0 1px rgba(255, 255, 255, 0.55), 0 3px 7px rgba(0, 0, 0, 0.35);
  --sh-btn: 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh-btn-hover: 0 1px 3px rgba(0, 0, 0, 0.4);
  --sh-seg: 0 1px 3px rgba(0, 0, 0, 0.45);
  --sh-destructive: inset 0 1px rgba(255, 255, 255, 0.12), 0 3px 7px rgba(0, 0, 0, 0.35);
  --scrim: rgba(12, 11, 9, 0.7);
}
</style>

a { color: inherit; text-decoration: none; }
.num, .cell--num, .stat__value, .hero__value { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: none; border-color: var(--focus-border); box-shadow: var(--focus-ring); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ===== Shell ===== */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; height: 100vh;
  padding: 25px 16px 16px; background: linear-gradient(100deg, var(--canvas-glow), var(--sidebar-2));
  border-right: 1px solid var(--line-sidebar); box-shadow: var(--sh-sidebar);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 10px 30px; }
.moon { position: relative; flex: none; width: 31px; height: 31px; border-radius: 50%; background: var(--dark); box-shadow: inset 0 1px rgba(255,255,255,.2), 0 2px 5px rgba(33,30,24,.15); }
.moon::after { content: ""; position: absolute; left: 8px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--canvas-glow); box-shadow: 4px 1px 0 var(--dark); }
.brand b { display: block; font-size: 18px; letter-spacing: -0.08em; }
.brand small { display: block; color: var(--ink-4); font-size: var(--fs-micro); }
.sidebar__scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.nav-group { margin-bottom: 18px; }
.nav-group__title {
  display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 11px 7px; border: 0; background: none;
  color: var(--ink-4); font-size: var(--fs-eyebrow); font-weight: var(--fw-eyebrow); letter-spacing: 0.1em; text-transform: uppercase; text-align: left;
}
.nav-group__title .ic { opacity: 0; transition: opacity var(--t-fast); }
.nav-group__title:hover .ic, .nav-group.is-collapsed .nav-group__title .ic { opacity: 1; }
.nav-group.is-collapsed .nav { display: none; }
.nav-group.is-collapsed .nav-group__title .ic { transform: rotate(-90deg); }
.nav { display: grid; gap: 3px; }
.nav__item {
  display: flex; align-items: center; gap: 11px; width: 100%; min-height: var(--nav-row-h); padding: 0 11px; border: 0; border-radius: var(--r-2);
  background: transparent; color: var(--ink-2); font-size: var(--fs-nav); font-weight: var(--fw-nav); letter-spacing: var(--ls-nav); line-height: 1; text-align: left;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav__item:hover { background: var(--ink-hover); color: var(--ink); }
.nav__item.is-active { color: var(--ink-inverse); background: var(--dark-grad); box-shadow: var(--sh-dark); }
.nav__item .ic { flex: none; color: var(--ink-3); }
.nav__item.is-active .ic { color: var(--ink-inverse); }
.nav__count { margin-left: auto; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 700; }
.is-active .nav__count { color: var(--ink-inverse-2); }
.sidebar__foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-sidebar); }
.account { display: flex; gap: 9px; align-items: center; width: 100%; margin-top: 4px; padding: 10px; border: 0; border-radius: var(--r-2); background: none; text-align: left; }
.account:hover { background: var(--ink-hover); }
.avatar { display: grid; place-items: center; flex: none; width: 29px; height: 29px; border-radius: 50%; background: var(--well-3); box-shadow: inset 0 1px rgba(255,255,255,.13); font-size: var(--fs-micro); font-weight: 700; }
.account b { display: block; font-size: var(--fs-table); font-weight: 650; }
.account small { display: block; margin-top: 2px; color: var(--ink-4); font-size: var(--fs-micro); }

.page { width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--page-pad-t) var(--page-pad-x) 56px; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; color: var(--ink-3); font-size: var(--fs-table); }
.crumb { display: flex; align-items: center; gap: 8px; }
.crumb a:hover { color: var(--ink); }
.crumb b { color: var(--ink-2); font-weight: 650; }
.crumb i { color: var(--ink-5); font-style: normal; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-caption); font-weight: 600; color: var(--ink-3); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-5); }
.status--fresh { color: var(--gain); } .status--fresh::before { background: var(--gain); }
.status--stale { color: var(--loss); } .status--stale::before { background: var(--loss); }

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 26px; }
.eyebrow { margin-bottom: 10px; color: var(--ink-4); font-size: var(--fs-eyebrow); font-weight: var(--fw-eyebrow); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; }
.eyebrow .sep { margin: 0 6px; color: var(--ink-5); }
h1 { margin: 0; font-size: var(--fs-h1); font-weight: var(--fw-h1); letter-spacing: var(--ls-h1); line-height: 1.1; }
.page-head p { margin: 8px 0 0; color: var(--ink-3); font-size: var(--fs-body); }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; color: var(--ink-3); font-size: var(--fs-table); font-weight: 600; }
.back:hover { color: var(--ink); }
.actions { display: flex; gap: 8px; align-items: center; flex: none; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: var(--control-h); padding: 0 13px; border: 1px solid var(--line-strong); border-radius: var(--r-2);
  background: linear-gradient(var(--paper), var(--paper-2)); box-shadow: var(--sh-btn); color: var(--ink-2); font-size: var(--fs-caption); font-weight: 650; white-space: nowrap;
  transition: background var(--t-fast), box-shadow var(--t-fast), color var(--t-fast);
}
.btn:hover { background: var(--paper); color: var(--ink); box-shadow: var(--sh-btn-hover); }
.btn:active { background: var(--well); box-shadow: none; }
.btn .ic { color: var(--ink-3); }
.btn:hover .ic { color: var(--ink-2); }
.btn--primary { border-color: transparent; background: var(--dark-grad); box-shadow: var(--sh-dark); color: var(--ink-inverse); }
.btn--primary:hover { background: var(--dark-grad-hover); color: var(--ink-inverse); box-shadow: var(--sh-dark); }
.btn--primary:active { background: var(--dark-lo); }
.btn--primary .ic, .btn--primary:hover .ic { color: var(--ink-inverse); }
.btn--ghost { border-color: transparent; background: none; box-shadow: none; }
.btn--ghost:hover { background: var(--ink-hover); box-shadow: none; }
.btn--danger { border-color: transparent; background: none; box-shadow: none; color: var(--loss); }
.btn--danger:hover { background: var(--loss-soft); color: var(--loss); box-shadow: none; }
.btn--danger .ic, .btn--danger:hover .ic { color: var(--loss); }
.btn--sm { height: var(--control-h-sm); padding: 0 11px; font-size: var(--fs-micro); }
.btn--icon { width: var(--control-h); padding: 0; }
.btn--icon.btn--sm { width: var(--control-h-sm); }
.btn[disabled], .btn.is-disabled { opacity: .45; pointer-events: none; }
.btn.is-loading .ic { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Segmented control (period / filter) */
.seg { display: inline-flex; gap: 1px; padding: 3px; border-radius: var(--r-2); background: var(--well-2); }
.seg__btn { padding: 0 10px; height: 26px; border: 0; border-radius: var(--r-1); background: transparent; color: var(--ink-3); font-size: var(--fs-micro); font-weight: 600; transition: background var(--t-fast), color var(--t-fast); }
.seg__btn:hover { color: var(--ink); }
.seg__btn.is-active { background: var(--paper); color: var(--ink); box-shadow: var(--sh-seg); }
.seg--lg .seg__btn { height: 30px; padding: 0 12px; font-size: var(--fs-caption); }

/* ===== Fields ===== */
.field { margin-bottom: 17px; }
.field__label { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--ink-2); font-size: var(--fs-caption); font-weight: 700; }
.field__label .opt { color: var(--ink-5); font-weight: 500; }
.input, .select, .textarea {
  width: 100%; height: var(--input-h); padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--r-2); outline: 0; background: var(--paper); color: var(--ink);
  font-size: var(--fs-body); transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.input::placeholder { color: var(--ink-5); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--line-hover); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--focus-border); box-shadow: var(--focus-ring); }
.input[disabled] { background: var(--well); color: var(--ink-4); }
.input.is-invalid { border-color: var(--loss); }
.input.is-invalid:focus { box-shadow: var(--loss-ring); }
.textarea { height: auto; min-height: 88px; padding: 10px 11px; resize: vertical; }
.select-wrap { position: relative; }
.select { appearance: none; padding-right: 32px; }
.select-wrap .ic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-4); }
.input-wrap { position: relative; }
.input-wrap .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-4); }
.input-wrap .input { padding-left: 33px; }
.input-wrap .unit { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-4); font-size: var(--fs-caption); font-weight: 600; }
.field__hint { margin-top: 6px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
.field__error { display: flex; align-items: center; gap: 5px; margin-top: 6px; color: var(--loss); font-size: var(--fs-micro); font-weight: 600; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-2--narrow { grid-template-columns: 1fr 138px; }
.search { width: 240px; height: 35px; }
.search .input { height: 35px; font-size: var(--fs-table); }
.check { display: inline-flex; align-items: center; gap: 9px; font-size: var(--fs-table); font-weight: 500; color: var(--ink-2); cursor: pointer; }
.check input { appearance: none; width: 16px; height: 16px; margin: 0; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--paper); display: grid; place-items: center; }
.check input:checked { background: var(--dark); border-color: var(--dark); }
.check input:checked::after { content: ""; width: 5px; height: 9px; margin-top: -2px; border: solid var(--ink-inverse); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.switch { position: relative; display: inline-block; width: 34px; height: 20px; }
.switch input { appearance: none; width: 100%; height: 100%; margin: 0; border-radius: 10px; background: var(--well-3); transition: background var(--t-base); cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform var(--t-base) var(--ease); }
.switch input:checked { background: var(--dark); }
.switch input:checked::after { background: var(--ink-inverse); transform: translateX(14px); }
/* The one theme-specific component rule (spec D13b): the off-state thumb stays light on the dark track. */
:root[data-theme="dark"] .switch input:not(:checked)::after { background: var(--ink-2); }

/* ===== Surfaces ===== */
.card { border: 1px solid var(--line); border-radius: var(--r-4); background: linear-gradient(145deg, var(--paper), var(--paper-2)); box-shadow: var(--sh-2); }
.card--flat { box-shadow: var(--sh-1); }
.card--table { overflow: hidden; background: var(--paper); box-shadow: var(--sh-3); }
.card__body { padding: 20px 21px; }
.card__head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 21px; }
.card__title { margin: 0; font-size: var(--fs-h2); font-weight: var(--fw-h2); letter-spacing: var(--ls-h2); }
.card__sub { margin: 5px 0 0; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
h3, .h3 { margin: 0; font-size: var(--fs-h3); font-weight: var(--fw-h3); letter-spacing: var(--ls-h3); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 13px; }
.section-head h2 { margin: 0; font-size: 17px; font-weight: var(--fw-h2); letter-spacing: -0.04em; }
.link { border: 0; background: none; padding: 0; color: var(--ink-2); font-size: var(--fs-caption); font-weight: 650; }
.link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 17px; }
.stats--3 { grid-template-columns: repeat(3, 1fr); }
.stats--2x2 { grid-template-columns: repeat(2, 1fr); }
.stat { container-type: inline-size; padding: 18px 19px; border: 1px solid var(--line); border-radius: var(--r-3); background: linear-gradient(150deg, var(--paper), var(--paper-2)); box-shadow: var(--sh-1); }
.stat__label { display: flex; align-items: center; justify-content: space-between; color: var(--ink-3); font-size: var(--fs-caption); font-weight: 600; }
.stat__value { display: block; margin-top: 10px; font-size: var(--fs-stat); font-size: clamp(var(--fs-h3), 13.5cqi, var(--fs-stat)); font-weight: var(--fw-stat); letter-spacing: var(--ls-stat); line-height: 1.1; }
.stat__note { display: block; margin-top: 6px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--s1); }

.gain { color: var(--gain); } .loss { color: var(--loss); } .muted { color: var(--ink-3); } .faint { color: var(--ink-4); }
.delta { font-weight: 650; }

/* Hero (dominant number + chart) */
.hero { position: relative; overflow: hidden; padding: 24px 24px 16px; }
.hero::after { content: ""; position: absolute; width: 340px; height: 180px; right: -100px; top: -120px; border-radius: 50%; background: var(--hero-orb); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.hero__label { color: var(--ink-3); font-size: var(--fs-table); font-weight: 600; }
.hero__value { display: block; margin: 7px 0 8px; font-size: var(--fs-display); font-weight: var(--fw-display); letter-spacing: var(--ls-display); line-height: 1; }
.hero__delta { font-size: var(--fs-table); font-weight: 650; }
.hero__delta span { margin-left: 5px; color: var(--ink-4); font-weight: 450; }
.hero__aside { text-align: right; }
.hero__aside .hero__value { font-size: 22px; letter-spacing: -0.05em; margin: 6px 0 6px; }

/* ===== Table ===== */
.table { border-top: 1px solid var(--line); }
.table__head, .table__row { display: grid; align-items: center; padding: 0 14px; }
.table__head { height: 40px; background: var(--well); border-bottom: 1px solid var(--line); color: var(--ink-3); font-size: var(--fs-thead); font-weight: var(--fw-thead); letter-spacing: var(--ls-thead); text-transform: uppercase; }
.table__head .sortable { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.table__head .sortable:hover { color: var(--ink); }
.table__row { min-height: var(--table-row-h); border-bottom: 1px solid var(--line-soft); color: var(--ink-2); font-size: var(--fs-table); font-weight: var(--fw-table); transition: background var(--t-fast); }
.table__row:last-child { border-bottom: 0; }
.table__row:hover, .table__row.is-hot { background: var(--well); }
.table__row.is-clickable { cursor: pointer; }
.table__row .row-actions { opacity: 0; transition: opacity var(--t-fast); }
.table__row:hover .row-actions, .table__row:focus-within .row-actions { opacity: 1; }
.cell--num { text-align: right; }
.cell--name { color: var(--ink); font-weight: var(--fw-table-name); }
.entity { display: flex; gap: 10px; align-items: center; color: var(--ink); }
.entity b { display: block; font-size: var(--fs-table); font-weight: var(--fw-table-name); }
.entity small { display: block; margin-top: 3px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
.logo { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--s1); box-shadow: inset 0 1px rgba(255,255,255,.13); color: var(--ink-inverse); font-size: var(--fs-micro); font-weight: 750; }
.logo--2 { background: var(--s2); } .logo--3 { background: var(--s3); } .logo--4 { background: var(--s4); color: var(--ink); }
.logo--soft { background: var(--well-2); color: var(--ink-2); box-shadow: none; }
.table__group { padding: 9px 14px 6px; background: var(--paper); border-bottom: 1px solid var(--line-soft); color: var(--ink-4); font-size: var(--fs-micro); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.table__foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
.toolbar { display: flex; gap: 8px; align-items: center; }

/* ===== Badges ===== */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--well-2); color: var(--ink-2); font-size: var(--fs-micro); font-weight: 650; white-space: nowrap; }
.badge--gain { background: var(--gain-soft); color: var(--gain); }
.badge--loss { background: var(--loss-soft); color: var(--loss); }
.badge--dark { background: var(--dark); color: var(--ink-inverse); }
.badge--outline { background: none; border: 1px dashed var(--line-strong); color: var(--ink-3); }
.badge .dot { width: 5px; height: 5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 13px; background: var(--paper); color: var(--ink-2); font-size: var(--fs-micro); font-weight: 650; }
.chip.is-active { background: var(--dark); border-color: var(--dark); color: var(--ink-inverse); }

/* ===== Progress ===== */
.progress { position: relative; height: 6px; border-radius: 3px; background: var(--well-3); overflow: hidden; }
.progress__bar { height: 100%; border-radius: 3px; background: var(--s1); transition: width var(--t-base) var(--ease); }
.progress--over .progress__bar { background: var(--loss); }
.progress__mark { position: absolute; top: -3px; width: 2px; height: 12px; border-radius: 1px; background: var(--paper); box-shadow: 0 0 0 1px var(--ink-3); }

/* ===== Menu / tooltip / toast ===== */
.menu { position: absolute; z-index: 5; min-width: 190px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: var(--sh-pop); }
.menu__item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 9px; border: 0; border-radius: var(--r-1); background: none; color: var(--ink-2); font-size: var(--fs-table); font-weight: 550; text-align: left; }
.menu__item:hover { background: var(--well); color: var(--ink); }
.menu__item .ic { color: var(--ink-3); }
.menu__item--danger, .menu__item--danger .ic { color: var(--loss); }
.menu__item--danger:hover { background: var(--loss-soft); color: var(--loss); }
.menu__sep { height: 1px; margin: 5px 4px; background: var(--line-soft); }
.tip { position: absolute; z-index: 6; padding: 7px 9px; border-radius: 7px; background: var(--dark); color: var(--ink-inverse); font-size: var(--fs-micro); font-weight: 550; line-height: 1.4; pointer-events: none; box-shadow: var(--sh-pop); white-space: nowrap; }
.tip b { color: var(--ink-inverse); font-weight: 700; }
.tip small { display: block; color: var(--ink-inverse-2); font-weight: 500; }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 7; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: var(--sh-pop); color: var(--ink); font-size: var(--fs-table); font-weight: 600; transform: translateY(8px); opacity: 0; transition: transform var(--t-base) var(--ease), opacity var(--t-base); }
.toast.is-on { transform: none; opacity: 1; }
.toast .ic { color: var(--gain); }

/* ===== Modal ===== */
.modal-scrim { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: var(--scrim); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity var(--t-base); }
.modal-scrim.is-open { opacity: 1; pointer-events: auto; }
.modal { width: 560px; max-width: calc(100vw - 48px); overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--r-5); background: var(--paper); box-shadow: var(--sh-modal); transform: translateY(10px) scale(.985); transition: transform var(--t-base) var(--ease); }
.is-open .modal { transform: none; }
.modal--sm { width: 440px; }
.modal__head { display: flex; justify-content: space-between; align-items: flex-start; padding: 25px 27px 20px; border-bottom: 1px solid var(--line-soft); }
.modal__head h2 { margin: 0; font-size: var(--fs-modal); font-weight: var(--fw-modal); letter-spacing: var(--ls-modal); }
.modal__head p { margin: 6px 0 0; color: var(--ink-3); font-size: var(--fs-table); }
.modal__close { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--well); color: var(--ink-3); }
.modal__close:hover { background: var(--well-2); color: var(--ink); }
.modal__body { padding: 23px 27px 8px; }
.modal__foot { display: flex; align-items: center; justify-content: space-between; padding: 16px 27px; border-top: 1px solid var(--line-soft); background: var(--well); }
.modal__foot .actions { margin-left: auto; }

/* ===== Empty / skeleton ===== */
.empty { display: grid; place-items: center; text-align: center; padding: 48px 24px; color: var(--ink-3); }
.empty .ic { color: var(--ink-5); margin-bottom: 12px; }
.empty h3 { color: var(--ink); margin-bottom: 6px; }
.empty p { margin: 0 0 16px; max-width: 320px; font-size: var(--fs-table); }
.skeleton { border-radius: 6px; background: linear-gradient(90deg, var(--well-2) 25%, var(--well) 50%, var(--well-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ===== Charts ===== */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart__axis { display: flex; justify-content: space-between; margin-top: 6px; color: var(--chart-axis); font-size: var(--fs-micro); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; color: var(--ink-3); font-size: var(--fs-micro); font-weight: 600; }
.legend__item { display: inline-flex; align-items: center; gap: 6px; }
.legend__swatch { width: 14px; height: 2px; background: var(--chart-line); border-radius: 1px; }
.legend__swatch--dash { background: repeating-linear-gradient(90deg, var(--chart-cost) 0 3px, transparent 3px 5px); }
.legend__swatch--block { width: 8px; height: 8px; border-radius: 2px; }
.legend__swatch--dot { width: 7px; height: 7px; border-radius: 50%; }
.ring { position: relative; width: 130px; height: 130px; border-radius: 50%; }
.ring::after { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: var(--paper); }
.ring__center { position: absolute; z-index: 1; inset: 0; display: grid; place-content: center; text-align: center; color: var(--ink-4); font-size: 9px; font-weight: 600; }
.ring__center b { display: block; margin-top: 3px; color: var(--ink); font-size: 14px; letter-spacing: -0.04em; }

.two-col { display: grid; grid-template-columns: 1.4fr .6fr; gap: 18px; align-items: start; }
.two-col--even { grid-template-columns: 1fr 1fr; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: var(--fs-table); color: var(--ink-3); }
.kv:last-child { border: 0; }
.kv b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.proto-tag { position: fixed; right: 15px; bottom: 14px; z-index: 3; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink-3); font-size: var(--fs-micro); pointer-events: none; }

/* ===== Additions: destructive confirm button, inline alerts ===== */
.btn--destructive { border-color: transparent; background: var(--loss); box-shadow: var(--sh-destructive); color: var(--ink-inverse); }
.btn--destructive:hover { background: var(--loss-hover); color: var(--ink-inverse); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--well); color: var(--ink-2); font-size: var(--fs-table); }
.alert .ic { flex: none; margin-top: 1px; color: var(--ink-3); }
.alert b { display: block; color: var(--ink); font-weight: 650; }
.alert--error { border-color: var(--loss-line); background: var(--loss-soft); } .alert--error .ic { color: var(--loss); }
.alert .actions { margin-left: auto; }

/* ===== Inline range bar (52-week low/high with current price and optional target) ===== */
.range { position: relative; display: inline-block; width: 92px; height: 12px; vertical-align: middle; }
.range__track { position: absolute; left: 0; right: 0; top: 5px; height: 2px; border-radius: 1px; background: var(--well-3); }
.range__dot { position: absolute; top: 2px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--chart-line); box-shadow: 0 0 0 2px var(--paper); }
.range__target { position: absolute; top: 1px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: var(--gain); }
.subnav-tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.subnav-tabs button { padding: 10px 12px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--ink-3); font-size: var(--fs-table); font-weight: 650; }
.subnav-tabs button.is-active { color: var(--ink); border-bottom-color: var(--ink); }
.prose { color: var(--ink-2); font-size: var(--fs-body); line-height: 1.55; }
.prose h4 { margin: 0 0 6px; font-size: 13px; font-weight: 650; color: var(--ink); }
.prose ul { margin: 6px 0 10px; padding-left: 18px; }
.prose li { margin-bottom: 3px; }
.prose p { margin: 0 0 10px; }
</style>
<style>
.page { padding-bottom: 72px; }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.topbar .theme { width: 30px; height: 30px; }
.ic { flex: none; }

/* Year stepper */
.yearstep { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-2); background: var(--well-2); }
.yearstep b { min-width: 50px; text-align: center; font-size: var(--fs-table); font-weight: 700; font-variant-numeric: tabular-nums; }
.yearstep button { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: var(--r-1); background: transparent; color: var(--ink-3); }
.yearstep button:hover { background: var(--paper); color: var(--ink); box-shadow: var(--sh-seg); }

/* Tables (grid rows) */
.ptable .table__head, .ptable .table__row { grid-template-columns: minmax(0, 2.3fr) 1fr 1fr 1.45fr 1fr 1.25fr 40px; gap: 14px; }
.ptable .table__row { cursor: pointer; }
.ptable .table__row.is-closed .entity b { color: var(--ink-3); }
.ledger .table__head, .ledger .table__row { grid-template-columns: 22px minmax(0, 1.5fr) minmax(0, 1.05fr) minmax(0, .95fr) minmax(0, 1.15fr) .85fr 32px; gap: 12px; }
.dtable .table__head, .dtable .table__row { grid-template-columns: 22px minmax(0, 1.7fr) minmax(0, 1fr) .9fr; gap: 12px; }
.ledger .table__row, .dtable .table__row { min-height: 52px; }
.table__row.is-selected, .table__row.is-selected:hover { background: color-mix(in srgb, var(--well) 60%, var(--well-2)); }
.cell--name.gain, .gain .cell--name { color: var(--gain); }
.cell--sub { display: block; margin-top: 3px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usage__pct { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: var(--fs-micro); font-weight: 650; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.circle { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--well-2); color: var(--ink-2); }
.plan-ic { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--well-2); color: var(--ink-2); }
.check { gap: 0; }
.toolbar .search { width: 220px; }
.foot-note { color: var(--ink-4); }

/* Bulk bar */
.bulkbar { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--well); }
.bulkbar b { color: var(--ink); font-size: var(--fs-table); }
.bulkbar .muted { font-size: var(--fs-table); margin-right: auto; font-variant-numeric: tabular-nums; }

/* Plan chip in the ledger */
.planchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 26px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 13px; background: var(--paper); color: var(--ink-2); font-size: var(--fs-micro); font-weight: 650; }
.planchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.planchip:hover { border-color: var(--line-hover); color: var(--ink); }
.planchip.is-empty { border-style: dashed; color: var(--ink-4); opacity: 0; transition: opacity var(--t-fast); }
.table__row:hover .planchip.is-empty, .planchip.is-empty:focus-visible { opacity: 1; }
.catchip { display: inline-flex; max-width: 100%; }
.catchip .badge { overflow: hidden; text-overflow: ellipsis; }

/* Filter badge (as Analýza akcií: dark badge with list-filter icon) */
.fbadge { padding-right: 3px; }
.fbadge button { display: grid; place-items: center; width: 16px; height: 16px; margin-left: 2px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--ink-inverse-2); }
.fbadge button:hover { background: rgba(255,255,255,.14); color: var(--ink-inverse); }
:root[data-theme="dark"] .fbadge button:hover { background: rgba(0,0,0,.1); }
.card.is-filtered { border-color: var(--line-hover); }
.card__title.with-badge { display: flex; align-items: center; gap: 9px; }

/* Detail layout */
.detail-grid { display: grid; grid-template-columns: minmax(300px, .82fr) minmax(0, 1.5fr); gap: 18px; align-items: start; margin-top: 18px; }
.catrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 5px 10px; width: 100%; padding: 11px 12px; border: 0; border-radius: var(--r-2); background: none; text-align: left; color: var(--ink-2); font-size: var(--fs-table); }
.catrow:hover { background: var(--well); }
.catrow.is-on { background: var(--well-2); }
.catrow b { color: var(--ink); font-weight: 650; }
.catrow .num { font-weight: 650; color: var(--ink); }
.catrow .progress { grid-column: 2 / -1; height: 5px; }
.catrow small { color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; margin-left: 6px; }
.catlist { padding: 0 9px 10px; }
.catsum { display: flex; justify-content: space-between; padding: 12px 12px 4px; margin-top: 4px; border-top: 1px solid var(--line-soft); font-size: var(--fs-table); color: var(--ink-3); }
.catsum b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* Chart */
.chart-card .card__head { padding-bottom: 6px; }
.chart-wrap { padding: 0 21px 16px; }
.chart svg text { font-family: var(--font); font-size: 11px; fill: var(--chart-axis); font-weight: 500; }
.chart svg .bar { fill: var(--s3); cursor: pointer; transition: opacity var(--t-fast); }
.chart svg .bar:hover { fill: var(--s2); }
.chart svg .bar.is-on { fill: var(--s1); }
.chart svg .bar.is-dim { opacity: .3; }
.chart svg .hit { fill: transparent; cursor: pointer; }
.chart svg .val { fill: var(--ink-3); font-weight: 650; }
.chart svg .grid { stroke: var(--chart-grid); }
.chart svg .base { stroke: var(--line); }
.chart svg .plan { stroke: var(--chart-cost); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart svg .cum { fill: none; stroke: var(--chart-line); stroke-width: 2; stroke-linejoin: round; }
.chart svg .cumdot { fill: var(--chart-line); }
.chart svg .future { fill: var(--well); }
.chart svg .lbl-strong { fill: var(--ink-2); font-weight: 650; }
.legend { margin-top: 0; }
.legend__swatch--bar { width: 8px; height: 10px; border-radius: 2px; background: var(--s3); }

/* Menu, picker */
.menu { min-width: 210px; }

.picker { width: 310px; padding: 6px; }

.picker__list { max-height: 320px; overflow-y: auto; margin-top: 4px; }

.picker .menu__item { align-items: flex-start; }
.picker .menu__item .ic { margin-top: 1px; }
.picker .menu__item small { display: block; margin-top: 2px; color: var(--ink-4); font-size: var(--fs-micro); font-weight: 500; }
.picker .menu__item .tick { margin-left: auto; color: var(--ink-2); }
.picker__note { padding: 6px 9px 4px; color: var(--ink-4); font-size: var(--fs-micro); }
.picker__empty { padding: 14px 9px; color: var(--ink-4); font-size: var(--fs-table); }

.modal--wide { width: 720px; }

.empty .actions { justify-content: center; }

.cat-chip { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; color: var(--cat); }

.cat-chip--lg { width: 44px; height: 44px; border-radius: 13px; } .cat-chip--lg .ic { width: 22px; height: 22px; }

.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

function viewPlans() {
  const all = plans.filter((p) => p.year === st.year);
  const active = all.filter((p) => !p.closed), closed = all.filter((p) => p.closed);
  const prev = plans.filter((p) => p.year === st.year - 1);
  const q = st.query.trim().toLocaleLowerCase('cs');
  let rows = st.seg === 'active' ? active : st.seg === 'closed' ? closed : all;
  if (q) rows = rows.filter((p) => p.name.toLocaleLowerCase('cs').includes(q));
  const rank = (p) => { const s = status(p), r = spentOf(p.id) / p.amount; return (p.closed ? -10 : 0) + (s === 'over' ? 3 : s === 'near' ? 2 : 0) + r; };
  rows = rows.slice().sort((a, b) => rank(b) - rank(a));

  const planned = all.reduce((s, p) => s + p.amount, 0);
  const spent = all.reduce((s, p) => s + spentOf(p.id), 0);
  const left = active.reduce((s, p) => s + p.amount - spentOf(p.id), 0);
  const over = active.filter((p) => status(p) === 'over').length, near = active.filter((p) => status(p) === 'near').length;

  const head = `

function planRow(p) {
  const s = spentOf(p.id), n = paysOf(p.id).length, r = pct(s, p.amount), stt = status(p), left = p.amount - s;

function fbadge(parts, clear) {
  if (!parts.length) return '';
  return `<span class="badge badge--dark fbadge" title="Tento widget je zúžený filtrem">${ic('list-filter', 12)}Filtr: ${parts.map(esc).join(' · ')}<button type="button" data-act="clear" data-what="${clear}" aria-label="Zrušit filtr">${ic('x', 11)}</button></span>`;
}
function monthRange(p, list) {
  const keys = list.map((x) => x.date.slice(0, 7));
  let from = p.year + '-01', to = p.year + '-12';
  keys.forEach((k) => { if (k < from) from = k; if (k > to) to = k; });
  const out = []; let [y, m] = from.split('-').map(Number);
  while (true) { const k = y + '-' + String(m).padStart(2, '0'); out.push(k); if (k === to) break; m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function viewPlan() {
  const p = byId(st.planId);

  const list = paysOf(p.id).sort((a, b) => (a.date < b.date ? 1 : -1));

  const accounts = new Set(list.map((x) => x.acc)).size;
  const monthLbl = st.month ? MF[+st.month.slice(5) - 1] + (st.month.slice(0, 4) !== String(p.year) ? ' ' + st.month.slice(0, 4) : '') : null;

    ${p.closed ? `<div class="alert" style="margin-bottom:17px">${ic('lock')}<div><b>Plán je uzavřený</b>Nenabízí se při zařazování plateb. Platby, které v něm už jsou, se dál počítají.</div><div class="actions"><button type="button" class="btn btn--sm" data-act="toggle" data-id="${p.id}">Obnovit plán</button></div></div>` : ''}

  const chart = `<section class="card chart-card${st.cat ? ' is-filtered' : ''}">

      <p class="card__sub">${st.cat ? 'Útrata kategorie ' + esc(st.cat) + ' v tomto plánu po měsících' : 'Čistá útrata plánu po měsících · kliknutím na měsíc zúžíte widgety pod grafem'}</p></div>
      ${st.cat ? '' : `<div class="legend"><span class="legend__item"><i class="legend__swatch legend__swatch--bar"></i>Útrata v měsíci</span><span class="legend__item"><i class="legend__swatch"></i>Celkem od začátku</span><span class="legend__item"><i class="legend__swatch legend__swatch--dash"></i>Plánováno</span></div>`}</div>
    <div class="chart-wrap chart">${chartSvg(p, list)}</div></section>`;

  const cats = {};
  inMonth.forEach((x) => { const c = (cats[x.cat] = cats[x.cat] || { sum: 0, n: 0 }); c.sum -= x.amt; c.n++; });

  const zaco = `<section class="card${st.month ? ' is-filtered' : ''}"><div class="card__head"><div><h2 class="card__title with-badge">Kategorie ${fbadge(monthLbl ? [monthLbl] : [], 'month')}</h2><p class="card__sub">Útrata plánu podle kategorií plateb · kliknutím zúžíte graf a platby</p></div></div><div class="catlist">${catsHtml}</div></section>`;

  // Platby
  const shown = list.filter((x) => (!st.month || x.date.startsWith(st.month)) && (!st.cat || x.cat === st.cat));
  const parts = [monthLbl, st.cat].filter(Boolean);
  const sel = [...st.dsel].filter((id) => shown.some((x) => x.id === id));
  const allOn = shown.length && sel.length === shown.length;
  const bar = sel.length ? `<div class="bulkbar"><b>${payWord(sel.length)}</b><span class="muted">· ${signed(sel.reduce((a, id) => a + pays.find((x) => x.id === id).amt, 0))}</span>

  let lastDay = '';
  const prow = (x) => {

    : `<div class="empty">${ic('receipt', 26)}<h3>Do plánu zatím nepatří žádná platba</h3><p>Vyberte platby ze všech účtů tady, nebo je hromadně zařaďte v seznamu plateb na účtu.</p><button type="button" class="btn btn--primary btn--sm" data-act="addpays" data-id="${p.id}">${ic('list-plus', 14)}Přidat platby</button></div>`}

function chartSvg(p, list) {
  const months = monthRange(p, list);
  const src = list.filter((x) => !st.cat || x.cat === st.cat);
  const byM = months.map((k) => -src.filter((x) => x.date.startsWith(k)).reduce((a, x) => a + x.amt, 0));
  const todayK = TODAY.slice(0, 7);
  const cum = []; let run = 0; months.forEach((k, i) => { run += byM[i]; cum.push(k <= todayK ? run : null); });
  const W = 1000, H = 210, L = 58, R = 18, T = 18, B = 30;
  const top = st.cat ? Math.max(1, ...byM) * 1.25 : Math.max(p.amount, run, ...byM) * 1.1;
  const bottom = Math.min(0, ...byM) * 1.2;
  const y = (v) => T + (top - v) / (top - bottom) * (H - T - B);
  const slot = (W - L - R) / months.length, bw = Math.min(30, slot * 0.46);
  const cx = (i) => L + slot * i + slot / 2;
  const tick = (v) => (Math.abs(v) >= 1000 ? String(Math.round(v / 100) / 10).replace('.', ',') + '\u00a0tis.' : nf.format(v));
  let g = '';
  const fi = months.findIndex((k) => k > todayK);
  if (fi >= 0) g += `<rect class="future" x="${L + slot * fi}" y="${T - 8}" width="${W - R - (L + slot * fi)}" height="${H - B - T + 8}" rx="6"/><text x="${W - R - 6}" y="${T + 4}" text-anchor="end">Zbytek roku</text>`;
  const ticks = st.cat ? [0, top / 1.25 / 2, top / 1.25] : [0, p.amount / 2];
  ticks.forEach((v) => { g += `<line class="${v === 0 ? 'base' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${tick(v)}</text>`; });
  if (!st.cat) g += `<line class="plan" x1="${L}" x2="${W - R}" y1="${y(p.amount)}" y2="${y(p.amount)}"/><text x="${L - 10}" y="${y(p.amount) + 4}" text-anchor="end">${tick(p.amount)}</text><text x="${L + 6}" y="${y(p.amount) - 7}" class="lbl-strong">Plánováno ${kc(p.amount)}</text>`;
  months.forEach((k, i) => {
    const v = byM[i];
    if (v !== 0) {
      const y0 = y(Math.max(0, v)), h = Math.abs(y(v) - y(0));
      const cls = 'bar' + (st.month === k ? ' is-on' : st.month ? ' is-dim' : '');
      g += `<rect class="${cls}" x="${cx(i) - bw / 2}" y="${y0}" width="${bw}" height="${Math.max(2, h)}" rx="3"><title>${MF[+k.slice(5) - 1]} ${k.slice(0, 4)}: ${kc(v)}</title></rect>`;
      g += `<text class="val" x="${cx(i)}" y="${v > 0 ? y0 - 6 : y(v) + 13}" text-anchor="middle">${tick(v)}</text>`;
    }
    g += `<rect class="hit" data-act="month" data-k="${k}" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B + 22}"><title>${v ? 'Zúžit na ' + MF[+k.slice(5) - 1] : MF[+k.slice(5) - 1] + ': bez plateb'}</title></rect>`;
    const yr = k.slice(0, 4), first = i === 0 || k.endsWith('-01');
    g += `<text x="${cx(i)}" y="${H - 9}" text-anchor="middle" style="${st.month === k ? 'fill:var(--ink);font-weight:700' : ''}">${MS[+k.slice(5) - 1]}${first && yr !== String(p.year) ? ' ' + yr.slice(2) : ''}</text>`;
  });
  if (!st.cat && list.length) {
    const pts = cum.map((v, i) => (v === null ? null : cx(i) + ',' + y(v))).filter(Boolean);
    g += `<polyline class="cum" points="${pts.join(' ')}"/>`;
    const li = cum.map((v) => v !== null).lastIndexOf(true);
    g += `<circle class="cumdot" cx="${cx(li)}" cy="${y(cum[li])}" r="3.5"/><text class="lbl-strong" x="${cx(li) - 8}" y="${y(cum[li]) - 9}" text-anchor="end">${kc(cum[li])}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Útrata po měsících">${g}</svg>`;
}

  return `${topbar([['Peníze', 'account'], ['Bankovní účty', 'account'], [ACC.cs]])}

        <div class="toolbar"><div class="input-wrap search">${ic('search', 14)}<input class="input" id="lq" type="search" placeholder="Hledat protistranu, kategorii, plán" value="${esc(st.lquery)}" autocomplete="off"></div>

      ${bar}
      <div class="table"><div class="table__head"><label class="check"><input type="checkbox" data-act="lall" ${allOn ? 'checked' : ''} aria-label="Vybrat vše"></label><span>Protistrana</span><span>Detail</span><span>Kategorie</span><span>Výdajový plán</span><span class="cell--num">Částka</span><span></span></div>

/* ===== Render ===== */
function render(keepFocus) {
  sidebar();
  const html = st.view === 'plan' ? viewPlan() : st.view === 'account' ? viewAccount() : viewPlans();
  const focus = keepFocus && document.activeElement && document.activeElement.id;
  const caret = focus ? document.activeElement.selectionStart : null;
  $('page').innerHTML = html;
  if (focus && $(focus)) { $(focus).focus(); try { $(focus).setSelectionRange(caret, caret); } catch (e) {} }
}
function go(view, id) {
  st.view = view; if (id) st.planId = id;
  st.month = null; st.cat = null; st.dsel.clear(); closeMenu();
  if (view === 'plan') st.year = byId(st.planId).year;
  render(); window.scrollTo(0, 0);
}

/* ===== Toast ===== */
let toastTimer;
function toast(msg, undo) {
  const t = $('toast');
  t.innerHTML = ic('circle-check') + '<span>' + msg + '</span>' + (undo ? '<button type="button" class="link" id="undo">Vrátit zpět</button>' : '');
  t.classList.add('is-on');
  if (undo) $('undo').onclick = () => { undo(); t.classList.remove('is-on'); render(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('is-on'), undo ? 7000 : 3000);
}

/* ===== Menus and picker ===== */
let menuFor = null;
function openMenu(anchor, html, onClick, alignRight) {
  const m = $('menu');
  m.innerHTML = html; m.hidden = false; m.className = 'menu' + (html.includes('picker__') ? ' picker' : '');
  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth;
  let left = alignRight ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + m.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 6);
  m.style.left = left + window.scrollX + 'px'; m.style.top = top + window.scrollY + 'px';
  menuFor = { anchor, onClick };
}
function closeMenu() { $('menu').hidden = true; menuFor = null; }

function pickerHtml(ids, q) {
  const rows = ids.map((id) => pays.find((x) => x.id === id));
  const cur = new Set(rows.map((x) => x.plan));
  const ql = (q || '').trim().toLocaleLowerCase('cs');
  const years = [...new Set(plans.filter((p) => !p.closed).map((p) => p.year))].sort((a, b) => b - a);
  let list = '';
  years.forEach((y) => {
    const ps = plans.filter((p) => p.year === y && !p.closed && (!ql || p.name.toLocaleLowerCase('cs').includes(ql))).sort((a, b) => a.name.localeCompare(b.name, 'cs'));
    if (!ps.length) return;
    list += `<div class="picker__group">${y}</div>` + ps.map((p) => { const left = p.amount - spentOf(p.id); const only = cur.size === 1 && cur.has(p.id);
      return `<button type="button" class="menu__item" data-pick="${p.id}">${planChip(p, 'cat-chip--sm')}<span>${esc(p.name)}<small>${left < 0 ? 'přečerpáno o ' + kc(-left) : 'zbývá ' + kc(left)} z ${kc(p.amount)}</small></span>${only ? `<span class="tick">${ic('check', 14)}</span>` : ''}</button>`; }).join('');
  });
  return `<div class="picker__search"><div class="input-wrap">${ic('search', 14)}<input class="input" id="pq" placeholder="Hledat plán" value="${esc(q || '')}" autocomplete="off"></div></div>

/* ===== Events ===== */
document.addEventListener('click', (e) => {
  const m = $('menu');
  if (!m.hidden && !m.contains(e.target) && !(menuFor && menuFor.anchor.contains(e.target))) closeMenu();
  if (m.contains(e.target)) {
    const b = e.target.closest('[data-pick]'); if (b && menuFor) { menuFor.onClick(b.dataset.pick); return; }
    const a = e.target.closest('[data-menu]'); if (a && menuFor) { menuFor.onClick(a.dataset.menu); return; }

  }
  const nav = e.target.closest('[data-nav]');
  if (nav) { const v = nav.dataset.nav; if (v === 'x') toast('Tato stránka není součástí prototypu'); else go(v); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  if (e.target === $('scrim')) { closeModal(); return; }
  const t = e.target.closest('[data-act]');
  if (!t) { const row = e.target.closest('[data-open]'); if (row) go('plan', row.dataset.open); return; }
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case 'theme': { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; render(); break; }
    case 'year': st.year += +t.dataset.d; st.query = ''; render(); break;
    case 'seg': st.seg = t.dataset.k; render(); break;
    case 'new': openForm(null); break;
    case 'copy': openCopy(); break;
    case 'close': closeModal(); break;
    case 'edit': openForm(byId(id)); break;
    case 'toggle': toggleClosed(byId(id)); break;
    case 'del': openDelete(byId(id)); break;
    case 'delok': { const p = byId(id); pays.forEach((x) => { if (x.plan === id) x.plan = null; }); plans.splice(plans.indexOf(p), 1); closeModal(); toast('Plán ' + esc(p.name) + ' smazán'); go('plans'); break; }
    case 'rowmenu': case 'detailmenu': {
      e.stopPropagation(); const p = byId(id);
      const items = (act === 'rowmenu' ? `<button type="button" class="menu__item" data-menu="open">${ic('arrow-up-right', 14)}Otevřít</button>` : '') +
        `<button type="button" class="menu__item" data-menu="edit">${ic('pencil', 14)}Upravit</button>
         <button type="button" class="menu__item" data-menu="toggle">${ic(p.closed ? 'rotate-ccw' : 'lock', 14)}${p.closed ? 'Obnovit plán' : 'Uzavřít plán'}</button>
         <div class="menu__sep"></div><button type="button" class="menu__item menu__item--danger" data-menu="del">${ic('trash-2', 14)}Smazat plán</button>`;
      openMenu(t, items, (c) => { closeMenu(); if (c === 'open') go('plan', id); if (c === 'edit') openForm(p); if (c === 'toggle') toggleClosed(p); if (c === 'del') openDelete(p); }, true);
      break;
    }
    case 'month': st.month = st.month === t.dataset.k ? null : t.dataset.k; render(); break;
    case 'cat': st.cat = st.cat === t.dataset.k ? null : t.dataset.k; render(); break;
    case 'clear': { const w = t.dataset.what; if (w === 'cat' || w === 'both') st.cat = null; if (w === 'month' || w === 'both') st.month = null; render(); break; }
    case 'dclear': st.dsel.clear(); render(); break;
    case 'dremove': { const ids = [...st.dsel]; st.dsel.clear(); assign(ids, null); break; }
    case 'move': {
      const ids = [...st.dsel];
      openPicker(t, ids, () => st.dsel.clear());
      break;
    }
    case 'lclear': st.lsel.clear(); render(); break;
    case 'bulkadd': openPicker(t, [...st.lsel], () => st.lsel.clear()); break;
    case 'bulkremove': { const ids = [...st.lsel].filter((i) => pays.find((x) => x.id === i).plan); st.lsel.clear(); assign(ids, null); break; }
    case 'pickrow': openPicker(t, [id]); break;
    case 'addpays': openAddPays(byId(id)); break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'dsel') { t.checked ? st.dsel.add(t.dataset.id) : st.dsel.delete(t.dataset.id); render(); }
  if (act === 'lsel') { t.checked ? st.lsel.add(t.dataset.id) : st.lsel.delete(t.dataset.id); render(); }
  if (act === 'dall') { const shown = paysOf(st.planId).filter((x) => (!st.month || x.date.startsWith(st.month)) && (!st.cat || x.cat === st.cat)); if (t.checked) shown.forEach((x) => st.dsel.add(x.id)); else st.dsel.clear(); render(); }
  if (act === 'lall') { const list = pays.filter((x) => x.acc === 'cs' && x.date >= '2026-09-01'); if (t.checked) list.forEach((x) => st.lsel.add(x.id)); else st.lsel.clear(); render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { st.query = e.target.value; render(true); }
  if (e.target.id === 'lq') { st.lquery = e.target.value; render(true); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeMenu(); closeModal(); }
  if (e.key === 'Enter' && e.target.matches('[data-open]')) go('plan', e.target.dataset.open);
});

render();
})();
</script>
</body>
</html>
