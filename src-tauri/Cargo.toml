[package]
name = "moony"
version = "0.13.0"
description = "Private personal finance manager with an encrypted local database"
authors = ["Filip Král"]
license = "AGPL-3.0-only"
edition = "2021"
default-run = "moony"

# The in-repo mobile plugins build, lint and test with the app: `cargo test`, `cargo clippy` and
# `cargo check` in this directory cover them too (default-members), on the desktop as well.
[workspace]
members = [".", "plugins/moony-keychain"]
default-members = [".", "plugins/moony-keychain"]

[lib]
name = "moony_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Smaller, faster release binaries. Unwinding stays on (no panic = "abort"):
# a panic inside one command must not take the whole app down with it.
[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.5"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database with SQLCipher encryption
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "blob"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

# HTTP client for API calls (ECB rates, Frankfurter history, CoinGecko) - see services/http.rs
reqwest = { version = "0.13", features = ["json"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Cryptography - compatible with Node.js crypto
hex = "0.4"
rand = "0.10"
scrypt = "0.12"      # For scrypt key derivation (matches Node.js)
aes-gcm = "0.11"     # For AES-256-GCM encryption (matches Node.js)
subtle = "2"         # Constant-time comparison of the MCP bearer token
sha2 = { version = "0.11", default-features = false }  # Content hashes of stored attachments
zeroize = "1"        # Wipes the session's master key from memory (services/session_key.rs)

# Error handling
thiserror = "2"

# Logging: `log` macros -> tauri-plugin-log (app log directory, rotated)
log = "0.4"
tauri-plugin-log = "2"

# Lazy static for globals (exchange rates cache)
lazy_static = "1.5"

# URL encoding for API queries
urlencoding = "2"
yahoo_finance_api = "5"

# CSV import parsing - regex for column detection
regex = "1"
csv = "1.3"
encoding_rs = "0.8"

# CAMT.053 statements (statement_import)
quick-xml = "0.42"

# Image processing for photo gallery
image = "0.25"

# Version floor for the transitive `time` crate
time = "0.3.44"

# Type generation for TypeScript
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde"] }
specta-typescript = "=0.0.9"

# Text normalization (diacritics folding for rule matching)
unicode-normalization = "0.1"

# Local HTTP server for MCP API
axum = { version = "0.8", features = ["tokio"] }

# Backup archives (deflate only; zip is already a transitive dependency of tauri)
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Embedded MCP server (Streamable HTTP, mounted on the axum router)
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-streamable-http-server"] }

# Desktop only: auto-updater and relaunch after an update
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Mobile only: haptic feedback, local notifications (Phase 4 agenda reminders), and the in-repo
# keychain (biometric unlock: the DB key behind biometry; the privacy screen)
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-haptics = "2"
tauri-plugin-notification = "2"
moony-keychain = { path = "plugins/moony-keychain" }

[dev-dependencies]
tempfile = "3"
# `tauri::test::mock_app` lets the logging tests build the real logger without a window
tauri = { version = "2", features = ["test"] }

# scrypt at 2^17 is ~10x slower unoptimised; keep unlock and the many
# key-file tests fast in debug builds. Only the KDF crates, not the whole tree.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
