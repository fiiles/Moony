[package]
name = "moony"
version = "1.3.0"
description = "Private personal finance manager with an encrypted local database"
authors = ["Filip Král"]
license = "AGPL-3.0-only"
edition = "2021"
default-run = "moony"

# The in-repo mobile plugins build, lint and test with the app: `cargo test`, `cargo clippy` and
# `cargo check` in this directory cover them too (default-members), on the desktop as well.
[workspace]
members = [".", "plugins/moony-keychain"]
default-members = [".", "plugins/moony-keychain"]
# Vendored third-party crates are patched in, not linted or tested with the app
exclude = ["vendor/tauri-plugin-notification"]

[lib]
name = "moony_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Smaller, faster release binaries. Unwinding stays on (no panic = "abort"):
# a panic inside one command must not take the whole app down with it.
[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.5"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database with SQLCipher encryption
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "blob", "functions", "hooks"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

# HTTP client for API calls (ECB rates, Frankfurter history, Yahoo search) - see services/http.rs
reqwest = { version = "0.13", features = ["json", "stream"] }
# Streams a blob body into an upload piece by piece (services/sync/relay/http.rs)
futures-util = "0.3"

# UUID generation
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Cryptography - compatible with Node.js crypto
hex = "0.4"
base64 = "0.23"
flate2 = "1"
rand = "0.10"
scrypt = "0.12"      # For scrypt key derivation (matches Node.js)
aes-gcm = "0.11"     # For AES-256-GCM encryption (matches Node.js)
subtle = "2"         # Constant-time comparison of the MCP bearer token
sha2 = { version = "0.11", default-features = false }  # Content hashes of stored attachments
zeroize = "1"        # Wipes the session's master key from memory (services/session_key.rs)
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }  # Device sync envelopes and snapshot streams (XChaCha20-Poly1305, spec §9.2)
hkdf = "0.13"                    # Device sync key derivation (already in Cargo.lock through another crate)
hmac = "0.13"                    # Device sync pairing acknowledgement (already in Cargo.lock through hkdf)
x25519-dalek = { version = "3", features = ["static_secrets"] }  # Device sync: this device's key pair (spec §11.1)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }  # Sync Recovery Kit QR (SVG only)

# Error handling
thiserror = "2"

# Logging: `log` macros -> tauri-plugin-log (app log directory, rotated)
log = "0.4"
tauri-plugin-log = "2"

# Lazy static for globals (exchange rates cache)
lazy_static = "1.5"

# URL encoding for API queries
urlencoding = "2"
yahoo_finance_api = "5"

# CSV import parsing - regex for column detection
regex = "1"
csv = "1.3"
encoding_rs = "0.8"

# CAMT.053 statements (statement_import)
quick-xml = "0.42"

# Image processing for photo gallery
image = "0.25"

# Version floor for the transitive `time` crate
time = "0.3.44"

# Type generation for TypeScript
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde"] }
specta-typescript = "=0.0.9"

# Text normalization (diacritics folding for rule matching)
unicode-normalization = "0.1"

# Local HTTP server for MCP API
axum = { version = "0.8", features = ["tokio"] }

# Backup archives (deflate only; zip is already a transitive dependency of tauri)
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Embedded MCP server (Streamable HTTP, mounted on the axum router)
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-streamable-http-server"] }

# The in-repo keychain (biometric unlock: the DB key behind biometry; the privacy screen on the
# phone). Every platform builds it; on Linux it answers Unsupported.
moony-keychain = { path = "plugins/moony-keychain" }

# Desktop only: auto-updater and relaunch after an update
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Mobile only: haptic feedback and local notifications (Phase 4 agenda reminders)
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-haptics = "2"
tauri-plugin-notification = "2"
tauri-plugin-barcode-scanner = "=2.5.3"  # Sync pairing: scanning the pairing and Recovery Kit QR codes

# Android: SQLCipher needs a crypto provider. Apple platforms use CommonCrypto; Android has no
# system OpenSSL to link against, so libsqlite3-sys builds and statically links its own (rusqlite's
# `bundled-sqlcipher` plus this feature, which only applies to Android builds under resolver 2).
[target.'cfg(target_os = "android")'.dependencies]
libsqlite3-sys = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
# reqwest's TLS checks certificates with rustls-platform-verifier, which on Android must be given
# the JVM and the app context once at startup (`init_android_tls_verifier` in lib.rs). Same
# major versions as reqwest pulls in, so the types match.
rustls-platform-verifier = "0.7"
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
# `tauri::test::mock_app` lets the logging tests build the real logger without a window
tauri = { version = "2", features = ["test"] }
# Paused time (`#[tokio::test(start_paused = true)]`) for the sync engine's back-off and deadline tests
tokio = { version = "1", features = ["test-util"] }

# scrypt at 2^17 is ~10x slower unoptimised; keep unlock and the many
# key-file tests fast in debug builds. Only the KDF crates, not the whole tree.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
# The sync journal deflates every envelope it measures (flate2's Rust backend); unoptimised,
# deflate dominates the 5,000-row journal test.
[profile.dev.package.miniz_oxide]
opt-level = 3
# Sync blobs seal and open up to 100 MiB through XChaCha20-Poly1305; unoptimised, the cipher
# dominates the blob tests and a debug build's uploads and downloads.
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3

# tauri-plugin-notification 2.8.0 with the iOS tap crash fixed and `extra` reported on iOS
# (see vendor/tauri-plugin-notification/MOONY-PATCH.md)
[patch.crates-io]
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
